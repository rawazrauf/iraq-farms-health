<!-- Load Noto Sans Arabic so Arabic & Kurdish render cleanly even on devices
     that don't ship the font (common on low-end Androids). The font-family
     stack already references it; this actually makes it available. -->

<style>
:root{
  --ink:#14261B;        /* deep field green-black */
  --paper:#F3EFE4;      /* dry-soil paper */
  --clay:#B4552D;       /* arid clay (bad NDVI end) */
  --canal:#1E6E5A;      /* irrigation green (good NDVI end) */
  --wheat:#D9A441;      /* accent / ripe */
  --line:#C9BFA8;
  --panel:rgba(243,239,228,.94);
  --shadow:0 2px 14px rgba(20,38,27,.18);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Kufi Arabic",sans-serif;
  color:var(--ink);overscroll-behavior:none}
#map{position:absolute;inset:0}
[dir="rtl"]{direction:rtl}

/* top bar */
#bar{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;z-index:5;
  display:flex;gap:8px;align-items:center;pointer-events:none}
#title{pointer-events:auto;background:var(--panel);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:8px 12px;font-weight:800;letter-spacing:.2px;font-size:15px;line-height:1;
  display:flex;align-items:center;gap:8px}
#title .dot{width:9px;height:9px;border-radius:50%;background:var(--canal);flex:0 0 auto}
#lang{pointer-events:auto;margin-inline-start:auto;display:flex;gap:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:4px}
#lang button{border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;
  padding:6px 9px;border-radius:8px;color:var(--ink);opacity:.55;cursor:pointer}
#lang button.on{opacity:1;background:var(--ink);color:var(--paper)}

/* legend */
#legend{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-start:8px;z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:8px 10px;font-size:12px;max-width:46vw}
#legend .lbl{font-weight:700;margin-bottom:6px}
#ramp{height:10px;border-radius:6px;
  background:linear-gradient(90deg,var(--clay),#E8C15A,var(--canal))}
#legend .ends{display:flex;justify-content:space-between;margin-top:4px;opacity:.7;font-weight:600}

/* diagnostic panel */
#diag{position:absolute;bottom:calc(var(--safe-b) + 8px);inset-inline-start:8px;z-index:4;
  background:rgba(20,38,27,.82);color:#DCE7DF;backdrop-filter:blur(6px);
  border-radius:10px;padding:7px 9px;font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  box-shadow:var(--shadow);max-width:60vw}
#diag .row{display:flex;gap:6px;white-space:nowrap}
#diag .k{opacity:.55}
#diag .ok{color:#7FD6A6}#diag .warn{color:var(--wheat)}#diag .err{color:#F0876B}
#diag .geo{margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.12);
  font-size:10px;letter-spacing:.3px}

/* error banner */
#err{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;z-index:9;
  display:none;background:var(--clay);color:#fff;border-radius:10px;padding:10px 12px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow)}

/* field sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  background:var(--paper);border-top-left-radius:18px;border-top-right-radius:18px;
  box-shadow:0 -4px 24px rgba(20,38,27,.28);padding:12px 14px calc(var(--safe-b) + 14px)}
#sheet.open{transform:translateY(0)}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);
  margin:0 auto 10px}
#sheet h2{margin:0 0 2px;font-size:16px;font-weight:800}
#sheet .sub{margin:0 0 10px;font-size:12px;opacity:.6;font-weight:600}
#sheet .close{position:absolute;top:12px;inset-inline-end:14px;border:0;background:transparent;
  font-size:20px;line-height:1;color:var(--ink);opacity:.5;cursor:pointer;padding:4px}
#stat{display:flex;gap:8px;margin-bottom:10px}
#stat .card{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 9px}
.nbr{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:13px;font-weight:700;
  color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.nbr .nbr-ico{font-size:14px;flex:0 0 auto}
.nbr.loading{opacity:.55;font-weight:600}
#stat .card .n{font-size:20px;font-weight:800;line-height:1;white-space:nowrap}
#stat .card .c{font-size:10px;font-weight:700;opacity:.6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spark{width:100%;height:110px;display:block;background:#fff;border:1px solid var(--line);border-radius:12px}
#spark-wrap{position:relative}
#spark-tip{position:absolute;pointer-events:none;z-index:3;transform:translate(-50%,-115%);
  background:var(--ink);color:#F3EFE4;border-radius:8px;padding:5px 8px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(20,38,27,.28);font-size:12px;font-weight:700;line-height:1.25}
#spark-tip .tv{font-size:14px}
#spark-tip .td{font-size:10.5px;font-weight:600;opacity:.75}
#spark-tip::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
#spark-prov{position:absolute;right:8px;top:8px;z-index:4;max-width:min(88%,340px);
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  box-shadow:0 4px 18px rgba(20,38,27,.22)}
#spark-prov .pv-row{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
#spark-prov .pv-scene{font-size:11px;font-weight:600;color:#6B6350;
  word-break:break-all;line-height:1.35}
#spark-prov .pv-links{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#spark-prov .pv-link{display:inline-block;font-size:13px;font-weight:800;
  color:var(--canal);text-decoration:none;border:1.5px solid var(--canal);
  border-radius:8px;padding:5px 10px;text-align:center}
#spark-prov .pv-primary{color:#fff;background:var(--canal)}
#spark-prov .pv-close{position:absolute;top:6px;inset-inline-end:8px;border:0;background:transparent;
  font-size:18px;line-height:1;color:var(--ink);opacity:.5;cursor:pointer;padding:2px}
#sheet .msg{margin:12px 0 2px;padding:12px 14px;border-radius:12px;
  border-inline-start:4px solid var(--line);background:#fff}
#sheet .msg-main{font-size:14px;font-weight:700;line-height:1.35;color:var(--ink)}
#sheet .msg-sub{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:4px;opacity:.72}
/* health-band tints */
#sheet .msg.poor{background:#FBEDE6;border-inline-start-color:var(--clay)}
#sheet .msg.poor .msg-main{color:#8A3A18}
#sheet .msg.fair{background:#FBF3E0;border-inline-start-color:var(--wheat)}
#sheet .msg.fair .msg-main{color:#8A6410}
#sheet .msg.good{background:#E9F3EC;border-inline-start-color:var(--canal)}
#sheet .msg.good .msg-main{color:#155844}
#sheet .msg.none{background:#F0EDE3;border-inline-start-color:var(--line)}
#sheet .load{padding:26px 0;text-align:center;font-size:13px;font-weight:700;opacity:.6}

/* tools: search + my-fields */
#tools{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-end:8px;z-index:5;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
#search-wrap{pointer-events:auto;display:flex;gap:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px}
#search-input{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;
  padding:5px 8px;width:min(46vw,190px);color:var(--ink);outline:none}
#search-go{border:0;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
  font-size:12px;border-radius:8px;padding:5px 10px;cursor:pointer}
#pins-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px}
#pins-toggle #pins-count{opacity:.6;font-weight:700}
#help-btn{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer}
#health-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;opacity:.55}
#health-toggle.on{opacity:1;background:var(--ink);color:var(--paper)}
#water-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;opacity:.55}
#water-toggle.on{opacity:1;background:#1a4b8c;color:#fff;border-color:#1a4b8c}
#hist-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px}
#hist-toggle #hist-count{opacity:.6;font-weight:700}
#hist-panel{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-end:8px;z-index:6;
  width:min(84vw,300px);max-height:64vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px}
#hist-list .hrow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer}
#hist-list .hrow:hover{background:#fff}
#hist-list .hrank{font-size:15px;font-weight:800;width:26px;text-align:center;flex:0 0 auto}
#hist-list .hsw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
#hist-list .hbody{min-width:0;flex:1}
#hist-list .hid{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hist-list .hsub{font-size:11px;opacity:.6;font-weight:600}
#hist-list .himp{margin-inline-start:auto;font-weight:800;font-size:13px;white-space:nowrap}
#hist-empty{font-size:12px;opacity:.6;font-weight:600;padding:8px;text-align:center;line-height:1.5}
#zoom-hint[hidden]{display:none !important}
#zoom-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:6;background:var(--ink);color:var(--paper);border-radius:999px;
  padding:11px 18px;font-size:14px;font-weight:700;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none;
  animation:zoomhintin .25s ease}
#zoom-hint::before{content:"🔍";font-size:14px}
#locate-toast[hidden]{display:none !important}
#locate-toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);
  z-index:7;background:var(--ink);color:var(--paper);border-radius:16px;
  padding:12px 18px;font-size:14px;font-weight:600;box-shadow:var(--shadow);
  max-width:min(86vw,420px);text-align:center;line-height:1.4;
  animation:zoomhintin .25s ease}
/* Floating "find my location" button — modern circular FAB, thumb-reachable
   bottom-right, sitting just above the MapLibre zoom control. */
/* Group the location FAB and the zoom +/- control into one right-edge cluster.
   The zoom control (MapLibre default) sits bottom-right; we pin its right margin
   to match the FAB, and place the FAB just above it with a small gap so the two
   read as a single stack of map controls rather than two floating things. */
.maplibregl-ctrl-bottom-right{margin:0;inset-inline-end:12px;
  bottom:calc(var(--safe-b) + 12px)}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl{margin:0}
#locate-fab{position:absolute;inset-inline-end:12px;z-index:6;
  /* zoom control is ~64px tall + 12px from bottom; sit 8px above it */
  bottom:calc(var(--safe-b) + 12px + 64px + 8px);
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);color:var(--ink);
  border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:blur(6px);cursor:pointer;
  transition:transform .12s ease, background .18s ease, color .18s ease;
  -webkit-tap-highlight-color:transparent;pointer-events:auto}
#locate-fab:active{transform:scale(.92)}
#locate-fab.active{background:var(--canal);color:#fff;border-color:var(--canal)}
#locate-fab.locating{background:var(--canal);color:#fff;border-color:var(--canal)}
#locate-fab.locating svg{animation:locspin 1s linear infinite}
@keyframes locspin{to{transform:rotate(360deg)}}
/* Pulsing halo while locating */
#locate-fab.locating::after{content:"";position:absolute;inset:-4px;
  border-radius:50%;border:2px solid var(--canal);opacity:.6;
  animation:locpulse 1.3s ease-out infinite}
@keyframes locpulse{0%{transform:scale(.9);opacity:.6}
  100%{transform:scale(1.5);opacity:0}}
@keyframes zoomhintin{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* first-run guided tour */
#tour{position:fixed;inset:0;z-index:50}
#tour-dim{position:absolute;inset:0;background:rgba(20,38,27,.62)}
#tour-hole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,38,27,.62);
  border:2px solid var(--wheat);transition:all .35s cubic-bezier(.3,.8,.3,1);pointer-events:none}
#tour-card{position:absolute;z-index:2;width:min(88vw,340px);background:var(--paper);
  border-radius:16px;box-shadow:0 8px 30px rgba(20,38,27,.4);padding:16px 16px 12px;
  transition:all .35s cubic-bezier(.3,.8,.3,1)}
#tour-step{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--canal);opacity:.8;margin-bottom:6px}
#tour-text{font-size:15px;font-weight:600;line-height:1.4;color:var(--ink)}
#tour-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
#tour-skip{border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;
  color:var(--ink);opacity:.5;cursor:pointer;padding:4px 2px}
#tour-next{border:0;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
  font-size:14px;border-radius:10px;padding:9px 18px;cursor:pointer}

<noscript>
  <main style="max-width:760px;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.6;color:#14261B">
  <h1>Iraq Farms Health — Satellite Crop &amp; Field Health Map</h1>
  <p><strong>Iraq Farms Health</strong> is a free, mobile-friendly tool that shows the
  vegetation health of farm fields across Iraq using satellite imagery. It is built for
  smallholder farmers, agronomists, agricultural suppliers, and researchers who want a
  quick, trustworthy read on how a field's crops are doing — from a phone, in the field.</p>

  <h2>What it does</h2>
  <p>Open the interactive map, zoom to your area, and tap any field. The tool reads the
  latest cloud-free <strong>Sentinel-2</strong> satellite image and calculates
  <strong>NDVI</strong> (the Normalized Difference Vegetation Index — a standard measure
  of plant health) for that exact field. You see a simple health rating (Poor, Fair or
  Good), the current vegetation index, a <strong>two-year month-by-month trend</strong>,
  and a <strong>year-on-year comparison</strong> that tells you whether this season is
  greener or drier than the last.</p>

  <h2>Verify any reading yourself</h2>
  <p>Every figure can be checked independently. Each reading links out to the free
  <strong>Copernicus Browser</strong> from the European Space Agency, opened on the same
  field and the same satellite date, so a farmer, a buyer, or a supplier can confirm the
  numbers for themselves. Nothing is taken on trust.</p>

  <h2>Built for Iraq, in three languages</h2>
  <p>The tool works in <strong>English</strong>, <strong>Arabic (العربية)</strong> and
  <strong>Kurdish (کوردی)</strong>, with field boundaries covering the whole country and
  place names and governorate borders to help you navigate. Field data comes from the
  open <em>Fields of the World</em> dataset; imagery from the EU Copernicus programme's
  Sentinel-2 satellites.</p>

  <h2>Free and private</h2>
  <p>Iraq Farms Health is free to use and runs entirely in your browser. Your saved
  fields and history stay on your own device. This application requires JavaScript to
  display the interactive map — please enable JavaScript to use it.</p>

  <p><a href="https://www.iraqfarmshealth.com/">www.iraqfarmshealth.com</a></p>
  </main>
</noscript>

/* ---------- diagnostics ---------- */
const D = {
  fields:document.getElementById("d-fields"),
  geo:document.getElementById("d-geo"),
};
function diag(el,text,cls){ if(!el) return; el.textContent=text; el.className=cls||""; }
const errBox = document.getElementById("err");
function showErr(msg){errBox.textContent=msg;errBox.style.display="block";}

/* ---------- constants ---------- */
const BUILD = "2026.08.30-c";  // bump on each deploy so screenshots self-identify
// Stamp the build version so any screenshot self-identifies which deploy it is.
(function(){ const b=document.getElementById("d-build-v"); if(b) b.textContent = "build "+BUILD; })();
const PC = "https://planetarycomputer.microsoft.com/api/data/v1";
/* NDVI on Sentinel-2 L2A.
   IMPORTANT: since ESA Processing Baseline 04.00 (Jan 2022), reflectance is
   stored with a +1000 DN radiometric offset. PC serves RAW DN (offset NOT
   removed); Copernicus/Sentinel Hub remove it. In a normalized-difference
   index the shared *scale* cancels but the *additive offset does not* — it
   inflates the denominator (B08+B04) and squishes NDVI low. All our scenes are
   post-2022, so we subtract 1000 from each band to match ESA's harmonized
   values. This is what closed the ~0.2 gap vs Copernicus (0.54 -> ~0.74). */
/* NDVI on Sentinel-2 L2A, using the STANDARD formula (B08-B04)/(B08+B04) — the
   same one Copernicus Browser uses. An earlier "offset-corrected" variant
   (subtracting the PB04.00 +1000 DN offset from each band) was tried to chase an
   accuracy gap, but a direct cross-check against Copernicus's own Statistical Info
   showed the standard formula actually MATCHES Copernicus (~0.51-0.56 on a test
   field) while the offset version diverged (0.79) AND could blow up past NDVI's
   valid range when the denominator neared zero. So: standard formula. Both bands
   are positive DN, so the denominator is always well clear of zero — no blowup.
   A [-1,1] range check remains in code as a belt-and-suspenders safety net. */
const NDVI_EXPR = "(B08-B04)/(B08+B04)";
const NDMI_EXPR = "(B08-B11)/(B08+B11)";   // moisture: NIR vs SWIR (water absorbs SWIR)
// SAVI (Soil Adjusted Vegetation Index), L=0.5. Same NIR/Red bands as NDVI but
// damps bare-soil brightness, so it reads truer on sparse/arid cover (much of
// Iraq) where plain NDVI is dragged down by visible soil between plants.
// Range is [-1.5, 1.5], NOT [-1, 1] — the validity clamp below accounts for this.
const SAVI_EXPR = "((B08-B04)/(B08+B04+0.5))*1.5";
// FTW GLOBAL predictions — wall-to-wall, 195 countries incl. full Iraq, 10m, 2024/2025.
// Host works over plain HTTP, anonymous read (physically s3 tge-labs/ftw-global-data).
// Two files exist: 2025 (default) and 2024-with-confidence. We use 2025.
// Layer name format confirmed from FTW's own docs: "field-YYYY-01-01 00:00:00".
// Individual field polygons only render at zoom > 10 (below that the file is density).
// NOTE: the per-polygon `confidence` column is NULL across almost all of Iraq
// (the confidence layer covers mainly the 24 FTW training countries), so we do NOT
// style or filter by confidence here — it would blank out real Iraqi fields.
const FTW_PMTILES = "https://data.source.coop/ftw/global-data/predictions/vectors/alpha/global.pmtiles";
const FTW_SRC_LAYER = "field-2025-01-01 00:00:00";
const FTW_MIN_ZOOM = 13; // only show field outlines when zoomed to farm scale;
                          // below this the polygons blanket whole cities (over-detection)


/* ---------- map ---------- */
let map, lastField=null;
try{
  const proto = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", proto.tile);

  map = new maplibregl.Map({
    container:"map",
    preserveDrawingBuffer:true,   // allows capturing the map canvas for the shareable report
    style:{
      version:8,
      glyphs:"https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
      sources:{
        esri:{type:"raster",tiles:[
          "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
        ],tileSize:256,attribution:"Esri, Maxar, Earthstar Geographics"},
        places:{type:"raster",tiles:[
          "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"
        ],tileSize:256,attribution:"Esri"},
        roads:{type:"raster",tiles:[
          "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}"
        ],tileSize:256,attribution:"Esri"}
      },
      layers:[{id:"sat",type:"raster",source:"esri"}]
    },
    center:[43.1995,36.2282], zoom:14.8, maxZoom:16, minZoom:4,
    attributionControl:false
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  map.on("error",e=>{ if(e && e.error) console.warn("map:",e.error.message); });

  map.on("load", onMapLoad);
}catch(e){ showErr("Map failed to start: "+e.message); }

function onMapLoad(){
  // --- place-name + road labels overlay (transparent, no polygons) ---
  // Sits above imagery for orientation; NDVI is inserted beneath it and the
  // field outlines above it, so labels stay readable without clutter.
  // Esri reference overlays for orientation: transportation (roads) first, then
  // boundaries & place names on top. NDVI goes beneath these; field outlines above.
  try{
    map.addLayer({id:"roads",type:"raster",source:"roads",
      paint:{"raster-opacity":0.85}});
    map.addLayer({id:"labels",type:"raster",source:"places",
      paint:{"raster-opacity":0.95}});
  }catch(e){ console.warn("reference:",e.message); }

  // (Governorate boundaries + city labels come from the Esri reference layer
  // above. A previous custom Natural Earth boundary layer was removed to avoid
  // drawing a second, slightly-offset set of boundary lines.)

  // --- surface water occurrence (JRC Global Surface Water, 1984–2024) ---
  // Ready-made raster tiles from the EU JRC / Google dataset: pixels coloured by
  // how often they were water over ~40 years (white→pink→blue, blue = permanent).
  // Off by default; toggled via the Water button. Sits above satellite but below
  // the field outlines and labels so boundaries and place names stay readable.
  // Attribution: EC JRC/Google (required). Tiles top out around zoom 13.
  try{
    map.addSource("water-occ",{
      type:"raster",
      tiles:["https://storage.googleapis.com/global-surface-water/tiles2021/occurrence/{z}/{x}/{y}.png"],
      tileSize:256, maxzoom:13,
      attribution:"Surface water: EC JRC/Google"
    });
    map.addLayer({
      id:"water-occ", type:"raster", source:"water-occ",
      layout:{visibility:"none"},
      paint:{"raster-opacity":0.85}
    }, map.getLayer("roads") ? "roads" : undefined);
  }catch(e){ console.warn("water layer:",e.message); }

  // --- field-only health colouring ---
  // Instead of a raster wash across the whole map (which blended with satellite
  // greenery and confused users), we colour ONLY detected fields by their NDVI.
  // Each visible field is sampled via the same /statistics endpoint the tap uses,
  // then filled with the matching health colour. Health therefore appears strictly
  // inside fields — green outside a field is obviously just satellite, and the
  // coloured fills make fields visibly tappable.
  map.addSource("health",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({
    id:"health-fill",type:"fill",source:"health",
    paint:{"fill-color":["get","col"],"fill-opacity":0.72}
  }, map.getLayer("fields-line") ? "fields-line" : undefined);

  // --- FTW field-prediction density (low-zoom country-scale overview) ---
  // A raster tint showing where FTW's model is confident that fields exist, so
  // farmland is visible at country scale where individual polygons aren't yet
  // rendered. Source is FTW's global 500 m confidence COG, tiled on-the-fly by
  // the public titiler.xyz service (FTW publishes COG/Zarr, not {z}/{x}/{y}
  // tiles, so a tiler sits in between).
  //
  // PALETTE: single-hue PURPLES, deliberately NOT the green/orange used for the
  // vegetation-health scale — so this "where is the farmland" wash can't be
  // misread as field health. rescale FLOOR raised to 0.15 (from 0) so low-
  // confidence desert falls below the ramp and reads as near-nothing instead of
  // a colored speckle over empty sand. Top stays at 0.578178 (FTW's confidence max).
  //
  // Visible by default, low-zoom only (faded out by z13 where tappable field
  // polygons take over).
  // NOTE: this leans on a THIRD-PARTY tiler we don't control — if titiler.xyz is
  // slow or down, this optional overlay simply won't load; the app is unaffected.
  // The COG URL is verified from FTW docs; the rendered result has NOT been
  // verified on-device from the build environment — confirm it draws on a phone.
  try{
    const FTW_CONF_COG = "https://data.source.coop/ftw/global-data/predictions/confidence/confidence/prue_v1_confidence_global.tif";
    const ftwDensityTiles =
      "https://titiler.xyz/cog/tiles/WebMercatorQuad/{z}/{x}/{y}.png?url="+
      encodeURIComponent(FTW_CONF_COG)+
      "&rescale=0.22,0.578178&colormap_name=purples&nodata=-1";
    map.addSource("ftw-density",{
      type:"raster", tiles:[ftwDensityTiles], tileSize:256, maxzoom:FTW_MIN_ZOOM,
      attribution:"Field density: Fields of The World (CC-BY 4.0)"
    });
    map.addLayer({
      id:"ftw-density", type:"raster", source:"ftw-density",
      // Visible by default: this is the low-zoom "where is the farmland" wash.
      // maxzoom:FTW_MIN_ZOOM (13) stops it exactly where the tappable field
      // polygons begin; the opacity ramp fades it to 0 across z11→13 so there's
      // no gap and no hard pop at the handoff. Base opacity kept moderate so the
      // light (low-confidence) end reads as faint while dark purple farmland
      // stays clearly visible.
      minzoom:3, maxzoom:FTW_MIN_ZOOM,
      paint:{"raster-opacity":["interpolate",["linear"],["zoom"],3,0.35,9,0.35,11,0.32,13,0]}
    }, map.getLayer("roads") ? "roads" : undefined);
  }catch(e){ console.warn("ftw-density layer:",e.message); }

  // --- FTW field boundaries as PMTiles ---
  try{
    map.addSource("ftw",{type:"vector",url:"pmtiles://"+FTW_PMTILES});
    // Low-zoom density layer: shows where farmland is concentrated at country
    // scale, where individual tappable field polygons aren't yet visible.
    //
    // The low-zoom density wash is the "ftw-density" RASTER layer added earlier in
    // this file (FTW 500 m confidence COG via titiler.xyz). It's set visible and
    // tuned there — not duplicated here — to avoid a clashing source/layer id.
    map.addLayer({
      id:"fields-fill",type:"fill",source:"ftw","source-layer":FTW_SRC_LAYER,
      minzoom:FTW_MIN_ZOOM,
      paint:{"fill-color":"#ffffff","fill-opacity":0.001}
    });
    // Visible outline so coverage is obvious before any tap.
    map.addLayer({
      id:"fields-line",type:"line",source:"ftw","source-layer":FTW_SRC_LAYER,
      minzoom:FTW_MIN_ZOOM,
      paint:{"line-color":"#F3EFE4",
             "line-width":["interpolate",["linear"],["zoom"],11,0.5,15,1.6],
             "line-opacity":0.85}
    });
    // Selection highlight uses a GeoJSON source we control (the tapped polygon's
    // own geometry), NOT the tile feature-id — so it stays put through pan/zoom/
    // tile refresh and is reliably visible in a shared screenshot.
    map.addSource("sel",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addLayer({
      id:"sel-fill",type:"fill",source:"sel",
      paint:{"fill-color":"#D9A441","fill-opacity":0.18}
    });
    map.addLayer({
      id:"sel-line",type:"line",source:"sel",
      paint:{"line-color":"#D9A441","line-width":3.5,
             "line-opacity":1}
    });

    // Recount fields whenever the FTW source finishes loading tiles for the
    // current view, and whenever rendering settles — not only on moveend, or
    // the count stays stale/zero until the user nudges the map.
    let ftwEverLoaded=false;
    map.on("sourcedata",e=>{
      if(e.sourceId==="ftw" && e.isSourceLoaded){ ftwEverLoaded=true; checkCoverage(); }
    });
    map.on("idle", checkCoverage);
    map.on("moveend", checkCoverage);

    function checkCoverage(){
      if(!map.getLayer("fields-fill")) return;
      const zoomHint = document.getElementById("zoom-hint");
      const t = I18N[lang];
      if(map.getZoom() < FTW_MIN_ZOOM){
        diag(D.fields,"",""); // blank; the centred zoom banner explains this state
        if(zoomHint && !(typeof tourActive!=="undefined" && tourActive)) zoomHint.hidden = false;
        return;
      }
      if(zoomHint) zoomHint.hidden = true;
      const feats = map.queryRenderedFeatures({layers:["fields-fill"]});
      if(feats.length){
        diag(D.fields, `${feats.length} ${t.fieldsInView}`, "");
      } else if(!ftwEverLoaded || !map.areTilesLoaded()){
        diag(D.fields, t.loadingFields, "");   // tiles still arriving — not "empty"
      } else {
        diag(D.fields, t.noFieldsHere, "");
      }
    }

    map.on("click","fields-fill",onFieldTap);
    map.on("mouseenter","fields-fill",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","fields-fill",()=>map.getCanvas().style.cursor="");

    // Sample & colour visible fields whenever the map settles (if overlay on).
    map.on("idle", ()=>{ scheduleHealthSample(); });
  }catch(e){ diag(D.fields,"error","err"); showErr("Fields layer failed: "+e.message); }

  // --- live geo readout ---
  const upd=()=>{
    const c=map.getCenter();
    D.geo.textContent = `lat ${c.lat.toFixed(4)}, lon ${c.lng.toFixed(4)}  z ${map.getZoom().toFixed(1)}`;
  };
  map.on("move",upd); upd();

  // --- keep the address bar in sync with the current view ---
  // On every settled move, rewrite the URL to ?lat=&lon=&z= for the current
  // centre and zoom, so copying the URL (or refreshing) shares/restores exactly
  // what the user is looking at. We use replaceState (not pushState) so this does
  // NOT flood the back button — one tap still leaves the site, like Google Maps.
  // The address bar tracks the VIEW; the field Share button remains the way to
  // share a specific field with its reading.
  let __urlSyncOn = false;   // enabled after the initial load/flyto settles
  function syncUrlToView(){
    if(!__urlSyncOn) return;
    const c = map.getCenter();
    const params = new URLSearchParams(location.search);
    params.set("lat", c.lat.toFixed(5));
    params.set("lon", c.lng.toFixed(5));
    params.set("z",   map.getZoom().toFixed(1));
    try{ history.replaceState(null, "", location.pathname + "?" + params.toString()); }catch{}
  }
  map.on("moveend", syncUrlToView);

  // If opened via a shared field link (?lat=&lon=), go straight to that field
  // and skip the tour. Otherwise, maybe run the first-time tour.
  let sharedField = false;
  try{
    const q = new URLSearchParams(location.search);
    const la = parseFloat(q.get("lat")), lo = parseFloat(q.get("lon"));
    if(isFinite(la) && isFinite(lo)){
      sharedField = true;
      const z = parseFloat(q.get("z")); 
      map.jumpTo({center:[lo,la], zoom: isFinite(z)?z:16});
      // let field tiles load, then select the field at that point
      setTimeout(()=>flyToField(lo, la), 700);
    }
  }catch{}

  // Everything (map, sel source, field layers) now exists — safe to auto-run the
  // first-time tour. Must be here, not at top-level, or startTour runs before
  // the map is ready and silently fails.
  if(!sharedField && typeof maybeAutoTour==="function") maybeAutoTour();

  // Enable live URL syncing only after the initial view (default, shared link,
  // or tour jump) has settled — otherwise the first auto-move would overwrite an
  // incoming shared link before it's applied.
  setTimeout(()=>{ __urlSyncOn = true; syncUrlToView(); }, 1200);
}
