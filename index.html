<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
:root{
  --ink:#14261B;        /* deep field green-black */
  --paper:#F3EFE4;      /* dry-soil paper */
  --clay:#B4552D;       /* arid clay (bad NDVI end) */
  --canal:#1E6E5A;      /* irrigation green (good NDVI end) */
  --wheat:#D9A441;      /* accent / ripe */
  --line:#C9BFA8;
  --panel:rgba(243,239,228,.94);
  --shadow:0 2px 14px rgba(20,38,27,.18);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Kufi Arabic",sans-serif;
  color:var(--ink);overscroll-behavior:none}
#map{position:absolute;inset:0}
[dir="rtl"]{direction:rtl}

/* top bar */
#bar{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;z-index:5;
  display:flex;gap:8px;align-items:center;pointer-events:none}
#title{pointer-events:auto;background:var(--panel);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:8px 12px;font-weight:800;letter-spacing:.2px;font-size:15px;line-height:1;
  display:flex;align-items:center;gap:8px}
#title .dot{width:9px;height:9px;border-radius:50%;background:var(--canal);flex:0 0 auto}
#lang{pointer-events:auto;margin-inline-start:auto;display:flex;gap:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:4px}
#lang button{border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;
  padding:6px 9px;border-radius:8px;color:var(--ink);opacity:.55;cursor:pointer}
#lang button.on{opacity:1;background:var(--ink);color:var(--paper)}

/* legend */
#legend{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-start:8px;z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:8px 10px;font-size:12px;max-width:46vw}
#legend .lbl{font-weight:700;margin-bottom:6px}
#ramp{height:10px;border-radius:6px;
  background:linear-gradient(90deg,var(--clay),#E8C15A,var(--canal))}
#legend .ends{display:flex;justify-content:space-between;margin-top:4px;opacity:.7;font-weight:600}

/* diagnostic panel */
#diag{position:absolute;bottom:calc(var(--safe-b) + 8px);inset-inline-start:8px;z-index:4;
  background:rgba(20,38,27,.82);color:#DCE7DF;backdrop-filter:blur(6px);
  border-radius:10px;padding:7px 9px;font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  box-shadow:var(--shadow);max-width:60vw}
#diag .row{display:flex;gap:6px;white-space:nowrap}
#diag .k{opacity:.55}
#diag .ok{color:#7FD6A6}#diag .warn{color:var(--wheat)}#diag .err{color:#F0876B}
#diag .geo{margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.12);
  font-size:10px;letter-spacing:.3px}

/* error banner */
#err{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;z-index:9;
  display:none;background:var(--clay);color:#fff;border-radius:10px;padding:10px 12px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow)}

/* field sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  background:var(--paper);border-top-left-radius:18px;border-top-right-radius:18px;
  box-shadow:0 -4px 24px rgba(20,38,27,.28);padding:12px 14px calc(var(--safe-b) + 14px)}
#sheet.open{transform:translateY(0)}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);
  margin:0 auto 10px}
#sheet h2{margin:0 0 2px;font-size:16px;font-weight:800}
#sheet .sub{margin:0 0 10px;font-size:12px;opacity:.6;font-weight:600}
#sheet .close{position:absolute;top:12px;inset-inline-end:14px;border:0;background:transparent;
  font-size:20px;line-height:1;color:var(--ink);opacity:.5;cursor:pointer;padding:4px}
#stat{display:flex;gap:8px;margin-bottom:10px}
#stat .card{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 9px}
#stat .card .n{font-size:20px;font-weight:800;line-height:1;white-space:nowrap}
#stat .card .c{font-size:10px;font-weight:700;opacity:.6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spark{width:100%;height:110px;display:block;background:#fff;border:1px solid var(--line);border-radius:12px}
#spark-wrap{position:relative}
#spark-tip{position:absolute;pointer-events:none;z-index:3;transform:translate(-50%,-115%);
  background:var(--ink);color:#F3EFE4;border-radius:8px;padding:5px 8px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(20,38,27,.28);font-size:12px;font-weight:700;line-height:1.25}
#spark-tip .tv{font-size:14px}
#spark-tip .td{font-size:10.5px;font-weight:600;opacity:.75}
#spark-tip::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
#spark-prov{position:absolute;right:8px;top:8px;z-index:4;max-width:min(88%,340px);
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  box-shadow:0 4px 18px rgba(20,38,27,.22)}
#spark-prov .pv-row{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
#spark-prov .pv-scene{font-size:11px;font-weight:600;color:#6B6350;
  word-break:break-all;line-height:1.35}
#spark-prov .pv-links{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#spark-prov .pv-link{display:inline-block;font-size:13px;font-weight:800;
  color:var(--canal);text-decoration:none;border:1.5px solid var(--canal);
  border-radius:8px;padding:5px 10px;text-align:center}
#spark-prov .pv-primary{color:#fff;background:var(--canal)}
#spark-prov .pv-close{position:absolute;top:6px;inset-inline-end:8px;border:0;background:transparent;
  font-size:18px;line-height:1;color:var(--ink);opacity:.5;cursor:pointer;padding:2px}
#sheet .msg{margin:12px 0 2px;padding:12px 14px;border-radius:12px;
  border-inline-start:4px solid var(--line);background:#fff}
#sheet .msg-main{font-size:14px;font-weight:700;line-height:1.35;color:var(--ink)}
#sheet .msg-sub{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:4px;opacity:.72}
/* health-band tints */
#sheet .msg.poor{background:#FBEDE6;border-inline-start-color:var(--clay)}
#sheet .msg.poor .msg-main{color:#8A3A18}
#sheet .msg.fair{background:#FBF3E0;border-inline-start-color:var(--wheat)}
#sheet .msg.fair .msg-main{color:#8A6410}
#sheet .msg.good{background:#E9F3EC;border-inline-start-color:var(--canal)}
#sheet .msg.good .msg-main{color:#155844}
#sheet .msg.none{background:#F0EDE3;border-inline-start-color:var(--line)}
#sheet .load{padding:26px 0;text-align:center;font-size:13px;font-weight:700;opacity:.6}

/* tools: search + my-fields */
#tools{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-end:8px;z-index:5;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
#search-wrap{pointer-events:auto;display:flex;gap:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px}
#search-input{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;
  padding:5px 8px;width:min(46vw,190px);color:var(--ink);outline:none}
#search-go{border:0;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
  font-size:12px;border-radius:8px;padding:5px 10px;cursor:pointer}
#pins-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px}
#pins-toggle #pins-count{opacity:.6;font-weight:700}
#help-btn{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer}
#health-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;opacity:.55}
#health-toggle.on{opacity:1;background:var(--ink);color:var(--paper)}
#hist-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px}
#hist-toggle #hist-count{opacity:.6;font-weight:700}
#hist-panel{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-end:8px;z-index:6;
  width:min(84vw,300px);max-height:64vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px}
#hist-list .hrow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer}
#hist-list .hrow:hover{background:#fff}
#hist-list .hrank{font-size:15px;font-weight:800;width:26px;text-align:center;flex:0 0 auto}
#hist-list .hsw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
#hist-list .hbody{min-width:0;flex:1}
#hist-list .hid{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hist-list .hsub{font-size:11px;opacity:.6;font-weight:600}
#hist-list .himp{margin-inline-start:auto;font-weight:800;font-size:13px;white-space:nowrap}
#hist-empty{font-size:12px;opacity:.6;font-weight:600;padding:8px;text-align:center;line-height:1.5}
#zoom-hint[hidden]{display:none !important}
#zoom-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:6;background:var(--ink);color:var(--paper);border-radius:999px;
  padding:11px 18px;font-size:14px;font-weight:700;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none;
  animation:zoomhintin .25s ease}
#zoom-hint::before{content:"🔍";font-size:14px}
@keyframes zoomhintin{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* first-run guided tour */
#tour{position:fixed;inset:0;z-index:50}
#tour-dim{position:absolute;inset:0;background:rgba(20,38,27,.62)}
#tour-hole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,38,27,.62);
  border:2px solid var(--wheat);transition:all .35s cubic-bezier(.3,.8,.3,1);pointer-events:none}
#tour-card{position:absolute;z-index:2;width:min(88vw,340px);background:var(--paper);
  border-radius:16px;box-shadow:0 8px 30px rgba(20,38,27,.4);padding:16px 16px 12px;
  transition:all .35s cubic-bezier(.3,.8,.3,1)}
#tour-step{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--canal);opacity:.8;margin-bottom:6px}
#tour-text{font-size:15px;font-weight:600;line-height:1.4;color:var(--ink)}
#tour-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
#tour-skip{border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;
  color:var(--ink);opacity:.5;cursor:pointer;padding:4px 2px}
#tour-next{border:0;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
  font-size:14px;border-radius:10px;padding:9px 18px;cursor:pointer}
#tour-dots{display:flex;gap:5px}
#tour-dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
#tour-dots span.on{background:var(--canal)}
.tour-lang-q{font-size:13px;font-weight:700;opacity:.7;margin-bottom:12px;line-height:1.5;text-align:center}
.tour-lang-btns{display:flex;flex-direction:column;gap:8px}
.tour-lang-btns button{border:1.5px solid var(--line);background:#fff;font:inherit;
  font-weight:800;font-size:17px;color:var(--ink);border-radius:12px;padding:13px;cursor:pointer}
.tour-lang-btns button:active{background:var(--ink);color:var(--paper)}
/* tap-gate: let taps reach the map, keep the card clickable */
#tour.pass #tour-dim{pointer-events:none}
#tour.pass #tour-hole{pointer-events:none}
#tour.pass{pointer-events:none}
#tour.pass #tour-card{pointer-events:auto}
#tour-hole.pulse{animation:tourpulse 1.3s ease-in-out infinite}
@keyframes tourpulse{
  0%,100%{border-color:var(--wheat);box-shadow:0 0 0 9999px rgba(20,38,27,.62),0 0 0 0 rgba(217,164,65,.6)}
  50%{border-color:#F0C674;box-shadow:0 0 0 9999px rgba(20,38,27,.62),0 0 22px 6px rgba(217,164,65,.55)}
}
#pins-panel{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-end:8px;z-index:6;
  width:min(80vw,260px);max-height:60vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px}
#pins-head{display:flex;justify-content:space-between;align-items:center;
  font-weight:800;font-size:14px;padding:4px 6px 8px}
#pins-close{border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink);
  opacity:.5;cursor:pointer;padding:2px 6px}
#pins-list .pin{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer}
#pins-list .pin:hover{background:#fff}
#pins-list .pin .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
#pins-list .pin .pin-id{font-weight:700;font-size:13px}
#pins-list .pin .pin-sub{font-size:11px;opacity:.6;font-weight:600}
#pins-list .pin .pin-del{margin-inline-start:auto;border:0;background:transparent;
  font-size:16px;color:var(--ink);opacity:.4;cursor:pointer;padding:2px 6px}
#pins-empty{font-size:12px;opacity:.6;font-weight:600;padding:6px 8px 8px;text-align:center}
#sheet .pv-save{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
#sheet .share-btn{display:inline-block;font-size:13px;font-weight:800;cursor:pointer;
  color:var(--ink);background:transparent;border:1.5px solid var(--ink);
  border-radius:8px;padding:7px 12px}
#sheet .save-btn{display:inline-block;font-size:13px;font-weight:800;cursor:pointer;
  color:var(--ink);background:var(--wheat);border:0;border-radius:8px;padding:7px 12px}
#sheet .save-btn.saved{background:var(--canal);color:#fff}
</style>

<noscript>
  <main style="max-width:760px;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.6;color:#14261B">
  <h1>Iraq Farms Health — Satellite Crop &amp; Field Health Map</h1>
  <p><strong>Iraq Farms Health</strong> is a free, mobile-friendly tool that shows the
  vegetation health of farm fields across Iraq using satellite imagery. It is built for
  smallholder farmers, agronomists, agricultural suppliers, and researchers who want a
  quick, trustworthy read on how a field's crops are doing — from a phone, in the field.</p>

  <h2>What it does</h2>
  <p>Open the interactive map, zoom to your area, and tap any field. The tool reads the
  latest cloud-free <strong>Sentinel-2</strong> satellite image and calculates
  <strong>NDVI</strong> (the Normalized Difference Vegetation Index — a standard measure
  of plant health) for that exact field. You see a simple health rating (Poor, Fair or
  Good), the current vegetation index, a <strong>two-year month-by-month trend</strong>,
  and a <strong>year-on-year comparison</strong> that tells you whether this season is
  greener or drier than the last.</p>

  <h2>Verify any reading yourself</h2>
  <p>Every figure can be checked independently. Each reading links out to the free
  <strong>Copernicus Browser</strong> from the European Space Agency, opened on the same
  field and the same satellite date, so a farmer, a buyer, or a supplier can confirm the
  numbers for themselves. Nothing is taken on trust.</p>

  <h2>Built for Iraq, in three languages</h2>
  <p>The tool works in <strong>English</strong>, <strong>Arabic (العربية)</strong> and
  <strong>Kurdish (کوردی)</strong>, with field boundaries covering the whole country and
  place names and governorate borders to help you navigate. Field data comes from the
  open <em>Fields of the World</em> dataset; imagery from the EU Copernicus programme's
  Sentinel-2 satellites.</p>

  <h2>Free and private</h2>
  <p>Iraq Farms Health is free to use and runs entirely in your browser. Your saved
  fields and history stay on your own device. This application requires JavaScript to
  display the interactive map — please enable JavaScript to use it.</p>

  <p><a href="https://www.iraqfarmshealth.com/">www.iraqfarmshealth.com</a></p>
