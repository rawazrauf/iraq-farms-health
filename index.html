document.getElementById("sheet-close").addEventListener("click",()=>{
  sheet.classList.remove("open");
  const selSrc = map.getSource("sel");
  if(selSrc) selSrc.setData({type:"FeatureCollection",features:[]});
});

/* ---------- field-only health sampling ---------- */
let healthOn = true;                 // Health map toggle state
const __healthCache = new Map();     // fieldKey -> {v, col} (NDVI never re-fetched)
const __moistCache = new Map();      // fieldKey -> {v} NDMI moisture (sampled on tap)
const __saviCache = new Map();       // fieldKey -> {v} SAVI (sampled on tap, report only)
let __healthTimer = null;
let __healthRunId = 0;

function fieldKey(f){
  const c = polyCentroid(f.geometry);
  return c ? `${c[0].toFixed(4)},${c[1].toFixed(4)}` : JSON.stringify(f.geometry).slice(0,40);
}
function bboxArea(g){
  const b = geomBbox(g); if(!b) return 0;
  return Math.abs((b[2]-b[0])*(b[3]-b[1]));
}
function healthFeature(f, col){
  return {type:"Feature", properties:{col}, geometry:f.geometry};
}
const __healthShown = new Map();     // fieldKey -> colored feature currently on the layer
function renderHealth(){
  const src = map.getSource("health");
  if(src) src.setData({type:"FeatureCollection", features:Array.from(__healthShown.values())});
}
/* Reconcile the shown-set to a run's results WITHOUT clearing first. Fields that
   are still in view keep their existing colour (no flash); newly-resolved fields
   are added/updated; fields no longer in the in-view key-set are dropped. This
   replaces the old clear()-then-rebuild, which briefly wiped freshly-tapped
   fields and made their colour flicker. */
function pushHealth(resultMap, inViewKeys){
  // add / update everything the run resolved
  for(const [k,feat] of resultMap){ __healthShown.set(k, feat); }
  // drop only fields that are no longer in view (if we were told the view set)
  if(inViewKeys){
    for(const k of Array.from(__healthShown.keys())){
      if(!inViewKeys.has(k)) __healthShown.delete(k);
    }
  }
  renderHealth();
}
/* Add/replace a single coloured field immediately (used when a tapped field's
   NDVI arrives before the next sample run). Never removes anything. */
function mergeHealthField(f, col){
  if(!map.getSource("health")) return;
  __healthShown.set(fieldKey(f), healthFeature(f, col));
  renderHealth();
}
function scheduleHealthSample(){
  clearTimeout(__healthTimer);
  __healthTimer = setTimeout(runHealthSample, 350);   // debounce map settling
}
async function runHealthSample(){
  const src = map.getSource("health");
  if(!src) return;
  if(!healthOn || map.getZoom() < FTW_MIN_ZOOM){
    src.setData({type:"FeatureCollection",features:[]});
    return;
  }
  const runId = ++__healthRunId;
  let feats = [];
  try{ feats = map.queryRenderedFeatures({layers:["fields-fill"]}); }catch{ return; }
  const seen = new Set(), uniq = [];
  for(const f of feats){
    const k = fieldKey(f);
    if(seen.has(k)) continue; seen.add(k);
    uniq.push({f, k, area: bboxArea(f.geometry)});
  }
  uniq.sort((a,b)=> b.area - a.area);          // biggest fields first
  const batch = uniq.slice(0, 45);             // cap API volume
  const inViewKeys = new Set(uniq.map(u=>u.k));  // every field currently visible

  const out = new Map();
  for(const {f,k} of batch){
    const cached = __healthCache.get(k);
    if(cached && cached.v!=null) out.set(k, healthFeature(f, cached.col));
  }
  // First push: add cached results, but DON'T drop anything yet (no flicker of
  // freshly-tapped fields whose sample is still pending).
  pushHealth(out);

  const now = new Date();
  // Use the CURRENT calendar month only (1st of this month → today), matching
  // the newest bucket the field-tap uses. Previously this window started on the
  // 1st of LAST month, and because scenes are picked least-cloudy-first (not
  // newest-first), the sampler could grab last month's clearer scene — colouring
  // the polygon with an older value that disagreed with the sheet's current
  // reading. Restricting to this month keeps the two in sync.
  const from = new Date(now.getFullYear(), now.getMonth(), 1);
  const iso = d=> d.toISOString().slice(0,10);
  const todo = batch.filter(({k})=> !__healthCache.has(k));
  let i = 0;
  async function worker(){
    while(i < todo.length){
      if(runId !== __healthRunId) return;      // superseded by a newer run
      const {f,k} = todo[i++];
      try{
        const r = await ndviForWindow(f.geometry, iso(from), iso(now));
        if(r && r.value!=null){
          const col = ndviColorHex(r.value);
          __healthCache.set(k, {v:r.value, col});
          out.set(k, healthFeature(f, col));
          if(runId === __healthRunId && (i % 3 === 0 || i === todo.length)) pushHealth(out);
        } else {
          __healthCache.set(k, {v:null, col:null});
        }
      }catch{ /* skip */ }
    }
  }
  await Promise.all(Array.from({length:4}, worker));   // small concurrency
  // Final push: now reconcile against the in-view set — this is the only point
  // we drop fields that scrolled out of view.
  if(runId === __healthRunId) pushHealth(out, inViewKeys);
}

async function onFieldTap(e){
  const f = e.features && e.features[0];
  if(!f) return;
  // Lock the highlight to this polygon's geometry (survives pan/zoom/tile refresh).
  const selSrc = map.getSource("sel");
  if(selSrc) selSrc.setData({type:"Feature",properties:{},geometry:f.geometry});
  lastField = f;
  sheet.classList.add("open");
  // If the interactive tour is waiting for the user to tap a field, advance it.
  if(typeof window.__onTourFieldTap==="function") window.__onTourFieldTap();

  // Reuse cached history if this exact field was tapped before AND it finished
  // loading. A partially-loaded field (tap interrupted by another tap) is re-run.
  const cacheKey = resolveFieldId(f) || JSON.stringify(geomBbox(f.geometry));
  if(historyCache.has(cacheKey)){
    const cached = historyCache.get(cacheKey);
    const done = cached.filter(s=>!s.pending).length;
    if(done >= cached.length - 2){               // essentially complete
      f.__history = cached;
      renderField(f);
      return;
    }
    // else fall through and re-load this field's history
  }

  // Build the 24-month skeleton (oldest -> newest) and render it empty,
  // then fill each month in as its API calls return (progressive).
  const months = buildMonths(24);
  f.__history = months.map(m=>({label:m.label, ym:m.ym, year:m.year, monthIdx:m.monthIdx, from:m.from, to:m.to, v:null, pending:true}));
  historyCache.set(cacheKey, f.__history);
  renderField(f);

  // --- moisture (NDMI) for this field + a few neighbours, sampled on tap ---
  // Moisture isn't sampled constantly (that would double API load); we fetch it
  // when a field is opened. We sample the tapped field and up to ~12 nearby
  // fields so we can say whether this field is wetter/drier than its neighbours.
  sampleMoisture(f).catch(()=>{});
  // --- SAVI (soil-adjusted) sampled on tap too, for the detailed report only ---
  sampleSavi(f).catch(()=>{});

  // Colour the tapped polygon IMMEDIATELY: fetch just the current month first,
  // as a standalone call, so the field recolours right away instead of waiting
  // in line behind the full 24-month history fill.
  if(healthOn){
    const k = fieldKey(f);
    const cached = __healthCache.get(k);
    if(cached && cached.v!=null){
      mergeHealthField(f, cached.col);            // already known — instant
    }else{
      const cur = f.__history[f.__history.length-1];
      ndviForWindow(f.geometry, cur.from, cur.to).then(r=>{
        if(r && r.value!=null){
          const col = ndviColorHex(r.value);
          __healthCache.set(k, {v:r.value, col});
          mergeHealthField(f, col);
          // seed the history slot too, so the loop below skips re-fetching it
          cur.v = r.value; cur.date = r.date; cur.scene = r.scene; cur.cloud = r.cloud; cur.pending = false;
          if(lastField===f && sheet.classList.contains("open")) renderField(f);
        }
      }).catch(()=>{});
    }
  }

  // Fill newest-first so the current reading and this-month card populate fast.
  // Guard with a tap generation: if the user taps a DIFFERENT field, this loop
  // stops immediately instead of running all 24 months in the background and
  // clogging the request pipe (which made later taps stall).
  const myTap = ++__tapGen;
  const order = [...f.__history.keys()].reverse();
  for(const idx of order){
    if(myTap !== __tapGen) return;                 // a newer tap superseded us
    const slot = f.__history[idx];
    if(slot.v!=null && !slot.pending) continue;   // already seeded (e.g. current month)
    try{
      const r = await ndviForWindow(f.geometry, slot.from, slot.to);
      slot.v = r.value; slot.date = r.date; slot.err = r.err;
      slot.scene = r.scene; slot.cloud = r.cloud;
    }catch(err){ slot.v = null; slot.err = err.message; }
    slot.pending = false;
    if(lastField===f && sheet.classList.contains("open")) renderField(f); // live update
  }
  // Reading complete — log this field to history (ranked later by improvement).
  try{
    const id = resolveFieldId(f);
    const c = polyCentroid(f.geometry);
    if(id && c){
      const hist = f.__history;
      let cur=null; for(let i=hist.length-1;i>=0;i--){ if(hist[i].v!=null){ cur=hist[i].v; break; } }
      const yoy = computeYoY(hist);
      logHistory({id, lon:c[0], lat:c[1], ndvi:cur, band:healthBand(cur),
                  improve: (yoy && typeof yoy.diff==="number") ? yoy.diff : null,
                  improvePct: (yoy && typeof yoy.pct==="number") ? yoy.pct : null});
    }
  }catch(err){ console.warn("history:",err.message); }
}

/* Build n calendar months ending with the current month; oldest first.
   Each entry: {label:"Jul", ym:"2026-07", from, to} as YYYY-MM-DD strings. */
function buildMonths(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth()-i, 1));
    const start = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
    const end   = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0));
    const iso = x=>x.toISOString().slice(0,10);
    const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    out.push({
      label:mon, monthIdx:d.getUTCMonth(), year:d.getUTCFullYear(),
      ym:`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}`,
      from:iso(start), to:iso(end)
    });
  }
  return out;
}

const historyCache = new Map();
let __tapGen = 0;   // increments each field tap; supersedes older tap loads
let __sparkDots = [];      // {i,cx,cy,v,label,year,date,thisYear} per rendered dot
let __hoverDot = null;     // index of currently highlighted dot
let __pinnedDot = null;    // index of dot with provenance panel pinned open

/* NDVI mean for a field within a date window.
   A single scene can be cloudy over THIS field even if the month had several
   Sentinel-2 passes, so we fetch multiple candidate scenes (least-cloudy first)
   and try each until one returns a real, unmasked NDVI. Only if every candidate
   is masked/cloudy over the field do we report the month as empty. */

/* Fetch with a small retry-and-backoff on rate-limit / transient errors.
   Planetary Computer can return 429 ("Too Many Requests") or 503 when we sample
   many fields at once; retrying after a short, growing wait usually succeeds, so
   fewer fields silently fail to colour. Waits ~0.4s, 0.8s, 1.6s across 3 retries.
   Honours a Retry-After header when the server provides one. */
async function fetchRetry(url, opts, tries=3){
  let wait = 400;
  for(let attempt=0; ; attempt++){
    let r;
    try{ r = await fetch(url, opts); }
    catch(e){ if(attempt>=tries) throw e; await sleep(wait); wait*=2; continue; }
    if((r.status===429 || r.status===503) && attempt<tries){
      const ra = parseFloat(r.headers.get("retry-after"));
      await sleep(isFinite(ra) ? ra*1000 : wait);
      wait*=2; continue;
    }
    return r;
  }
}
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

async function ndviForWindow(geometry, from, to, expr){
  expr = expr || NDVI_EXPR;
  // Physical bounds of the index, used to reject blown-up pixel math (near-zero
  // denominators over bare/dark pixels). NDVI and NDMI are bounded to [-1,1];
  // SAVI with L=0.5 reaches [-1.5,1.5], so a flat ±1 clamp would wrongly discard
  // valid SAVI over healthy fields. Pick the bound from the expression.
  const bound = (expr === SAVI_EXPR) ? 1.5 : 1;
  const bbox = geomBbox(geometry);
  if(!bbox) throw new Error("bad geometry");
  const searchBody = {
    collections:["sentinel-2-l2a"],
    bbox,
    datetime:`${from}T00:00:00Z/${to}T23:59:59Z`,
    // Order by least cloud first: best chance of a clear view of the field.
    query:{"eo:cloud_cover":{"lt":60}},
    sortby:[{field:"eo:cloud_cover",direction:"asc"}],
    limit:8
  };
  const sr = await fetchRetry(`https://planetarycomputer.microsoft.com/api/stac/v1/search`,{
    method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
    body:JSON.stringify(searchBody)
  });
  if(!sr.ok) return {value:null, err:"search "+sr.status};
  const sj = await sr.json();
  const items = (sj.features||[]);
  if(!items.length) return {value:null, err:"no scene"};

  const feature = {type:"Feature",properties:{},geometry};
  let triedMasked = 0;
  // Walk candidates clearest-first; return the first that yields real NDVI.
  for(const item of items){
    const itemDate = (item.properties && item.properties.datetime || "").slice(0,10);
    const qs = new URLSearchParams({
      collection:"sentinel-2-l2a",
      item:item.id,
      expression:expr,
      asset_as_band:"true"
    }).toString();
    let stR;
    try{
      stR = await fetchRetry(`${PC}/item/statistics?${qs}`,{
        method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify(feature)
      });
    }catch{ continue; }
    if(!stR.ok) continue;                       // try next candidate
    let stJ; try{ stJ = await stR.json(); }catch{ continue; }
    const stats = firstStats(stJ);
    // Prefer the MEDIAN: it's immune to a handful of blown-up pixels (near-zero
    // denominator) that could skew the mean. titiler may key it as 'median' or
    // 'percentile_50'. Fall back to mean if neither present.
    let val = stats && (stats.median ?? stats.Median ?? stats["percentile_50"] ?? stats["50"]);
    if(val==null) val = stats && (stats.mean ?? stats.Mean);
    // Bounded to the index's physical range (see `bound` above). Anything
    // outside means the pixel math blew up over bare/dark pixels, so reject
    // and try the next scene.
    if(val!=null && isFinite(val) && val>=-bound && val<=bound){
      return {value:val, date:itemDate, scene:item.id, cloud:item.properties && item.properties["eo:cloud_cover"], tried:triedMasked+1};
    }
    triedMasked++;                              // masked / invalid — keep looking
  }
  // Every candidate scene was masked/cloudy over this field.
  return {value:null, err:`masked ×${triedMasked}`};
}

/* Sample NDMI moisture for the tapped field plus a handful of nearby visible
   fields, so we can show the field's moisture AND whether it's wetter/drier than
   its neighbours. Sampled on tap (not constantly) to limit API load. Uses the
   current calendar month, like the health sampler. Re-renders the sheet as
   values arrive. */
async function sampleMoisture(f){
  const now = new Date();
  const from = new Date(now.getFullYear(), now.getMonth(), 1);
  const iso = d=> d.toISOString().slice(0,10);
  const myKey = fieldKey(f);
  const myGen = __tapGen;   // tie to the current tap so stale samples don't render

  // 1) the tapped field's moisture first (its own value)
  if(!__moistCache.has(myKey)){
    try{
      const r = await ndviForWindow(f.geometry, iso(from), iso(now), NDMI_EXPR);
      if(r && r.value!=null) __moistCache.set(myKey, {v:r.value});
      else __moistCache.set(myKey, {v:null});
    }catch{ __moistCache.set(myKey, {v:null}); }
  }
  const mine = __moistCache.get(myKey);
  f.__moisture = mine ? mine.v : null;
  if(lastField===f && sheet.classList.contains("open")) renderField(f);

  // 2) a few neighbours for the comparison (only if we have a value to compare)
  if(f.__moisture==null) return;
  let feats = [];
  try{ feats = map.queryRenderedFeatures({layers:["fields-fill"]}); }catch{ return; }
  const seen = new Set([myKey]); const neighbours = [];
  for(const nf of feats){
    const k = fieldKey(nf);
    if(seen.has(k)) continue; seen.add(k);
    neighbours.push({f:nf, k, area: bboxArea(nf.geometry)});
  }
  neighbours.sort((a,b)=> b.area - a.area);
  const pick = neighbours.slice(0, 12);   // enough for a stable comparison
  let i=0;
  async function worker(){
    while(i < pick.length){
      if(myGen !== __tapGen) return;      // user tapped elsewhere — stop
      const {f:nf,k} = pick[i++];
      if(__moistCache.has(k)) continue;
      try{
        const r = await ndviForWindow(nf.geometry, iso(from), iso(now), NDMI_EXPR);
        __moistCache.set(k, {v:(r && r.value!=null)? r.value : null});
      }catch{ __moistCache.set(k, {v:null}); }
      if(myGen===__tapGen && lastField===f && sheet.classList.contains("open")) renderField(f);
    }
  }
  await Promise.all(Array.from({length:3}, worker));
  if(myGen===__tapGen && lastField===f && sheet.classList.contains("open")) renderField(f);
}

/* Sample SAVI (soil-adjusted vegetation) for the tapped field only. Unlike
   moisture there's no neighbour comparison — SAVI is shown solely in the
   detailed report, paired with NDVI so the reader sees how much bare soil is
   dragging the plain reading down. Sampled on tap; cached so the report build
   is instant. Uses the current calendar month, like the health/moisture
   samplers. */
async function sampleSavi(f){
  const now = new Date();
  const from = new Date(now.getFullYear(), now.getMonth(), 1);
  const iso = d=> d.toISOString().slice(0,10);
  const myKey = fieldKey(f);
  const myGen = __tapGen;
  if(!__saviCache.has(myKey)){
    try{
      const r = await ndviForWindow(f.geometry, iso(from), iso(now), SAVI_EXPR);
      __saviCache.set(myKey, {v:(r && r.value!=null)? r.value : null, err:(r&&r.err)||null});
    }catch(e){
      __saviCache.set(myKey, {v:null, err:(e&&e.message)||"threw"});
    }
  }
  if(myGen!==__tapGen) return;            // user tapped elsewhere meanwhile
  const s = __saviCache.get(myKey);
  f.__savi = s ? s.v : null;
  if(lastField===f && sheet.classList.contains("open")) renderField(f);
}


/* Bounding box [w,s,e,n] of a Polygon/MultiPolygon. */
function geomBbox(g){
  let ring;
  if(g.type==="Polygon") ring=g.coordinates[0];
  else if(g.type==="MultiPolygon") ring=g.coordinates.flat(1)[0];
  else return null;
  let w=Infinity,s=Infinity,e=-Infinity,n=-Infinity;
  ring.forEach(p=>{ w=Math.min(w,p[0]); e=Math.max(e,p[0]); s=Math.min(s,p[1]); n=Math.max(n,p[1]); });
  return [w,s,e,n];
}

/* Statistics response is a GeoJSON feature; stats live under
   properties.statistics, keyed by the band/expression name. */
function firstStats(j){
  let props = j && j.properties && j.properties.statistics;
  if(!props && j && j.features && j.features[0]){
    props = j.features[0].properties && j.features[0].properties.statistics;
  }
  if(!props) return null;
  const k = Object.keys(props)[0];
  return k ? props[k] : null;
}

/* ---------- render sheet ---------- */
/* Compare this field's value against nearby fields' values (already sampled for
   the health map, in __healthCache). Returns a simple word bucket, or null if we
   don't have enough neighbours to say anything honestly. `getVal` pulls the value
   to compare from a cache entry (NDVI by default). Needs >=5 neighbours. */
function neighborStanding(f, myVal, cache, getVal){
  if(myVal==null) return null;
  const myKey = fieldKey(f);
  const vals = [];
  for(const [k,entry] of cache){
    if(k===myKey) continue;
    const v = getVal(entry);
    if(v!=null && isFinite(v)) vals.push(v);
  }
  if(vals.length < 5) return null;               // too few to compare honestly
  // How many neighbours is this field at or above?
  const below = vals.filter(v=> v < myVal).length;
  const frac = below / vals.length;              // 0..1, higher = greener than more neighbours
  // Simple three-way bucket with a neutral middle band.
  if(frac >= 0.66) return "above";
  if(frac <= 0.33) return "below";
  return "around";
}

function renderField(f){
  const t = I18N[lang];
  const hist = f.__history || [];
  // "current" = newest month that has a value
  let cur = null, curDate = null;
  for(let i=hist.length-1;i>=0;i--){ if(hist[i].v!=null){ cur=hist[i].v; curDate=hist[i].date; break; } }
  const band = healthBand(cur);
  const loading = hist.some(h=>h.pending);
  const done = hist.filter(h=>!h.pending).length;

  // Year-on-year: newest filled month vs the same month one year earlier.
  const yoy = computeYoY(hist);

  sheetBody.innerHTML = `
    <h2>${t.title}</h2>
    <p class="sub">${fieldLabel(f)}${geoLabel(f)}${curDate ? "  ·  "+t.asOf+" "+curDate : ""}${loading?`  ·  ${done}/${hist.length}`:""}${(()=>{
      // Tiny dev-only SAVI state cue: near-invisible to farmers, legible to you,
      // so you can confirm SAVI is computing without downloading a report.
      //   · (faint dot) = still fetching   s0.88 = value in   s— = resolved null
      const k = fieldKey(f);
      let glyph;
      if(!__saviCache.has(k)) glyph = "·";
      else { const sv = __saviCache.get(k); glyph = (sv && sv.v!=null) ? ("s"+sv.v.toFixed(2)) : "s—"; }
      return `<span style="opacity:.28;font-variant-numeric:tabular-nums">  ·  ${glyph}</span>`;
    })()}</p>
    <div id="stat">
      <div class="card">
        <div class="n" style="color:${ndviColor(cur)}">${cur!=null?cur.toFixed(2):"—"}</div>
        <div class="c">${t.latest}</div>
      </div>
      <div class="card">
        <div class="n" style="color:${ndviColor(cur)}">${band ? t[band] : "—"}</div>
        <div class="c">${t.health}</div>
      </div>
      <div class="card">
        <div class="n" style="color:${yoy.color}">${yoy.text}</div>
        <div class="c">${t.vsLastYear}</div>
      </div>
    </div>
    ${(()=>{
      const st = neighborStanding(f, cur, __healthCache, e=>e.v);
      if(!st) return "";
      return `<div class="nbr"><span class="nbr-ico">🏞️</span> ${t["nbrHealth_"+st]}</div>`;
    })()}
    ${(()=>{
      const mv = f.__moisture;
      if(mv==null) return "";
      // Own moisture value with a rough band word, plus neighbour comparison.
      const band = mv>=0.2 ? "moist" : (mv>=0.0 ? "mid" : "dry");
      const mst = neighborStanding(f, mv, __moistCache, e=>e.v);
      const nbr = mst ? ` — ${t["nbrMoist_"+mst]}` : "";
      return `<div class="nbr"><span class="nbr-ico">💧</span> ${t["moist_"+band]}${nbr}</div>`;
    })()}
    <div id="spark-wrap">
      <canvas id="spark" width="640" height="150"></canvas>
      <div id="spark-tip" hidden></div>
      <div id="spark-prov" hidden></div>
    </div>
    <div class="msg ${band||'none'}">
      <div class="msg-main">${cur!=null ? (t[band+"Msg"]) : (loading? t.loading : t.noData)}</div>
      ${yoy.msg?`<div class="msg-sub">${yoy.msg}</div>`:""}
    </div>
    <div class="pv-save">${(()=>{
      const id = resolveFieldId(f);
      const already = id && pinExists(id);
      return `<button class="save-btn ${already?'saved':''}" id="save-field-btn" ${already?'disabled':''}>${already?t.saved:t.save}</button>`+
             `<button class="share-btn" id="share-field-btn">${t.share} ↗</button>`+
             `<button class="share-btn ${__reportReady?'':'loading'}" id="report-field-btn" ${__reportReady?'':'disabled'}>${__reportReady?(t.report+' ↓'):(t.preparing||'Preparing…')}</button>`;
    })()}</div>`;
  drawSpark(hist);
  attachSparkHover(hist);
  const saveBtn = document.getElementById("save-field-btn");
  if(saveBtn) saveBtn.addEventListener("click",()=>{
    const id = resolveFieldId(f);
    const c = polyCentroid(f.geometry);
    if(!id || !c) return;
    addPin({id, lon:c[0], lat:c[1], band: healthBand(cur)});
    saveBtn.textContent = t.saved; saveBtn.classList.add("saved"); saveBtn.disabled = true;
  });
  const shareBtn = document.getElementById("share-field-btn");
  if(shareBtn) shareBtn.addEventListener("click",()=> shareField(f, shareBtn));
  const reportBtn = document.getElementById("report-field-btn");
  if(reportBtn) reportBtn.addEventListener("click",()=> buildFieldReport(f, reportBtn));
  // Start (or refresh) the readiness monitor for this field, which enables the
  // Report button once the history + neighbour colours are loaded — so the tap
  // itself is fast and iOS keeps the share sheet (share must fire in the gesture).
  monitorReportReady(f);
}

/* Build a shareable link to this exact field and share/copy it. The link
   encodes the field centroid; opening it flies there and selects the field. */
function shareField(f, btn){
  const t = I18N[lang];
  const c = polyCentroid(f.geometry);
  if(!c) return;
  const id = resolveFieldId(f) || "";
  const base = "https://www.iraqfarmshealth.com/";
  const url = `${base}?lat=${c[1].toFixed(5)}&lon=${c[0].toFixed(5)}&z=16`;
  // IMPORTANT: share ONLY the URL. Including a `text`/title makes iOS append it
  // after the link ("...&z=16 Iraq Farms Health — FTW-..."), which breaks the URL
  // when a user pastes it. The clean link alone is what we want on the clipboard.
  if(navigator.share){
    navigator.share({ url }).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>{
      const old = btn.textContent; btn.textContent = t.copied;
      setTimeout(()=>{ btn.textContent = old; }, 1600);
    }).catch(()=>{ prompt(t.share, url); });
  } else {
    prompt(t.share, url);
  }
}

/* Build a shareable PNG report of the field: map thumbnail, health, 2-year chart,
   moisture, neighbour standing, date. Downloads (or shares) the image. The map
   thumbnail is attempted first; if the browser blocks the canvas export (cross-
   origin tile "tainting"), we fall back to a report WITHOUT the thumbnail rather
   than failing — the data portion always works because it's all our own drawing. */
/* Best-effort wait for nearby fields to have health colours cached, so the
   report's context panel isn't mostly grey "no data" polygons. Triggers a health
   sample if the overlay is on, then polls until a reasonable share of visible
   fields are coloured (or times out). */
function waitForNeighbourColours(f, timeoutMs){
  return new Promise((resolve)=>{
    // nudge the sampler so colours start populating even if health map is on but idle
    try{ if(typeof scheduleHealthSample==="function") scheduleHealthSample(); }catch{}
    const start = Date.now();
    const check = ()=>{
      let feats=[]; try{ feats = map.queryRenderedFeatures({layers:["fields-fill"]}); }catch{}
      if(feats.length){
        const keys = new Set(); let total=0, coloured=0;
        for(const nf of feats){ const k=fieldKey(nf); if(keys.has(k))continue; keys.add(k); total++;
          const c=__healthCache.get(k); if(c && c.col) coloured++; }
        // enough context once ~half (and at least 8) of visible fields are coloured
        if(total>0 && coloured>=Math.min(8, Math.ceil(total*0.5))) return resolve();
      }
      if(Date.now()-start > timeoutMs) return resolve();
      setTimeout(check, 300);
    };
    check();
  });
}

/* Resolve once the field's 24-month history has finished loading (no slots left
   pending), or after a timeout, so the report never captures a half-loaded chart. */
function waitForHistory(f, timeoutMs){
  return new Promise((resolve)=>{
    const start = Date.now();
    const check = ()=>{
      const h = f.__history || [];
      const stillPending = h.some(s=> s.pending);
      if(!stillPending && h.length>0) return resolve();
      if(Date.now()-start > timeoutMs) return resolve();   // give up waiting, build anyway
      setTimeout(check, 250);
    };
    check();
  });
}

let __reportReady = false;
let __reportReadyField = null;   // which field the current readiness applies to
let __reportMonitor = null;

/* Enable the Report button once this field's history and a reasonable share of
   neighbour colours are ready, so tapping it can build+share quickly (keeping
   the iOS gesture alive for the share sheet). Falls back to enabling after a
   timeout so the button never stays stuck on "Preparing…". */
function monitorReportReady(f){
  clearInterval(__reportMonitor);
  __reportReady = false; __reportReadyField = f;
  setReportReadyState();
  const start = Date.now();
  // kick neighbour sampling so colours populate
  try{ if(typeof scheduleHealthSample==="function") scheduleHealthSample(); }catch{}
  __reportMonitor = setInterval(()=>{
    if(lastField!==f){ clearInterval(__reportMonitor); return; }   // moved to another field
    const h = f.__history||[];
    const historyDone = h.length>0 && !h.some(s=>s.pending);
    let coloured=0,total=0;
    try{
      const seen=new Set();
      for(const nf of map.queryRenderedFeatures({layers:["fields-fill"]})){
        const k=fieldKey(nf); if(seen.has(k))continue; seen.add(k); total++;
        const cc=__healthCache.get(k); if(cc&&cc.col) coloured++;
      }
    }catch{}
    const coloursReady = total===0 || coloured>=Math.min(8, Math.ceil(total*0.5));
    // SAVI is fired at tap but resolves independently; without waiting for it the
    // report often builds first and the SAVI line silently omits (this was why it
    // showed on only some fields — a timing race). "Resolved" = the cache has an
    // entry for this field (a value OR a confirmed null), i.e. the fetch finished.
    // A no-data field still resolves (to null), so this can't hang; the 12s
    // timeout is the backstop either way.
    const saviResolved = __saviCache.has(fieldKey(f));
    const timedOut = Date.now()-start > 12000;
    if((historyDone && coloursReady && saviResolved) || timedOut){
      __reportReady = true; setReportReadyState();
      clearInterval(__reportMonitor);
    }
  }, 300);
}
function setReportReadyState(){
  const b = document.getElementById("report-field-btn");
  if(!b) return;
  const t = I18N[lang];
  if(__reportReady){ b.textContent=(t.report||"Report")+" ↓"; b.disabled=false; b.classList.remove("loading"); }
  else { b.textContent=t.preparing||"Preparing…"; b.disabled=true; b.classList.add("loading"); }
}

async function buildFieldReport(f, btn){
  const t = I18N[lang];
  if(!__reportReady) return;                 // shouldn't happen — button is disabled
  try{
    // Data is already loaded (the button only enabled once it was), so this is
    // fast and stays within the tap's gesture window → iOS shows the share sheet.
    const W = 1080, pad = 48;
    const cur = (f.__history||[]).slice().reverse().find(s=>s.v!=null);
    const curV = cur ? cur.v : null;
    const band = curV!=null ? healthBand(curV) : null;
    const id = resolveFieldId(f) || "";
    const c = polyCentroid(f.geometry);

    // --- field context panel: draw the field + its neighbours, coloured by
    // health (from __healthCache). Pure canvas polygon drawing — reliable, no
    // WebGL capture, no external tiles, always available. ---
    const ctxFields = collectContextFields(f);
    const thumbH = 460;
    // Height budget: header + thumbnail + stats + chart + NDVI table + context + footer
    const tableH = 30 + 30 + 2*52 + 20;   // label + header + 2 year rows + gap
    const H = pad + 120 + (thumbH+24) + 150 + (220+24) + tableH + 130 + 90 + pad;
    const cv = document.createElement("canvas"); cv.width=W; cv.height=H;
    const x = cv.getContext("2d");
    x.textBaseline = "top";
    x.fillStyle = "#F4F1E9"; x.fillRect(0,0,W,H);
    let y = pad;

    // header
    x.fillStyle = "#1E6E5A"; x.beginPath(); x.arc(pad+10, y+16, 10, 0, 7); x.fill();
    x.fillStyle = "#14261B"; x.font = "800 34px system-ui,sans-serif";
    x.fillText("Iraq Farms Health", pad+32, y+2);
    x.fillStyle = "#6b7b70"; x.font = "500 22px system-ui,sans-serif";
    const sub = `${id}${c?"  ·  "+`lat ${c[1].toFixed(4)}, lon ${c[0].toFixed(4)}`:""}`;
    x.fillText(sub, pad, y+50);
    if(cur && cur.date){ x.fillText(`${t.asOf} ${cur.date}`, pad, y+78); }
    y += 120;

    // field-context panel
    {
      const tw = W - pad*2, th = thumbH;
      x.fillStyle="#e9e4d6"; roundRectPath(x, pad, y, tw, th, 16); x.fill();
      x.save(); roundRectPath(x, pad, y, tw, th, 16); x.clip();
      drawFieldContext(x, f, ctxFields, pad, y, tw, th);
      x.restore();
      x.strokeStyle="#D9D2C2"; x.lineWidth=1; roundRectPath(x,pad,y,tw,th,16); x.stroke();
      y += th + 24;
    }

    // stat row
    const yoy = computeYoY(f.__history||[]);
    const cardW = (W - pad*2 - 24*2)/3;
    const bandTxt = band ? (t[band]||band) : "—";
    // computeYoY returns CSS variable colours ("var(--canal)") which canvas can't
    // parse — map them to real hex so the value actually renders.
    const cssVarHex = { "var(--canal)":"#1E6E5A", "var(--clay)":"#B4552D", "var(--wheat)":"#D9A441", "var(--ink)":"#14261B" };
    const yoyText = (yoy && yoy.text) ? yoy.text : "—";
    const yoyColor = (yoy && cssVarHex[yoy.color]) ? cssVarHex[yoy.color] : "#14261B";
    const stats = [
      { big: curV!=null? curV.toFixed(2):"—", small: t.latest, color:"#14261B" },
      { big: bandTxt, small: t.health, color: bandColor(band) },
      { big: yoyText, small: t.vsLastYear, color: yoyColor }
    ];
    stats.forEach((s,i)=>{
      const cx = pad + i*(cardW+24);
      x.fillStyle="#fff"; roundRectPath(x,cx,y,cardW,130,14); x.fill();
      x.strokeStyle="#D9D2C2"; x.lineWidth=1; roundRectPath(x,cx,y,cardW,130,14); x.stroke();
      x.fillStyle=s.color; x.font="800 38px system-ui,sans-serif";
      x.fillText(String(s.big), cx+18, y+22);
      x.fillStyle="#6b7b70"; x.font="600 20px system-ui,sans-serif";
      x.fillText(String(s.small), cx+18, y+86);
    });
    y += 150;

    // chart
    const chartH = 200, chartW = W - pad*2;
    x.fillStyle="#fff"; roundRectPath(x,pad,y,chartW,chartH,14); x.fill();
    x.strokeStyle="#D9D2C2"; roundRectPath(x,pad,y,chartW,chartH,14); x.stroke();
    drawSparkOnto(x, f.__history||[], pad+20, y+18, chartW-40, chartH-52);
    y += chartH + 24;

    // monthly NDVI table (exact figures, health-coloured cells)
    x.fillStyle="#6b7b70"; x.font="600 20px system-ui,sans-serif"; x.textAlign="left";
    x.fillText(t.monthlyNdvi || "Monthly vegetation index (NDVI)", pad, y);
    y += drawNdviTable(x, f.__history||[], pad, y+30, W-pad*2) + 30 + 20;

    // context lines
    // context lines (left-aligned), with the NDMI figure right-aligned so long
    // moisture descriptions don't overflow.
    const lines = [];
    const nh = neighborStanding(f, curV, __healthCache, e=>e.v);
    if(nh) lines.push({ text:"🏞️ " + t["nbrHealth_"+nh], right:null });
    if(f.__moisture!=null){
      const mv=f.__moisture; const mb = mv>=0.2?"moist":(mv>=0.0?"mid":"dry");
      // Keep this line concise for the fixed-width image: moisture word on the
      // left, NDMI figure on the right. (The neighbour comparison still appears
      // in the app's field sheet, where there's room.)
      lines.push({ text:"💧 " + t["moist_"+mb], right:`NDMI ${mv.toFixed(2)}` });
    }
    // SAVI vs NDVI (report-only expert figure): shows both numbers so the reader
    // sees how much bare soil is dragging the plain NDVI down. If SAVI diverges
    // meaningfully from NDVI the field is sparsely covered; if they agree the
    // cover is dense. Only shown when both values are available.
    if(f.__savi!=null && curV!=null){
      const gap = f.__savi - curV;
      const note = gap >= 0.06 ? t.saviGap : t.saviAgree;
      lines.push({ text:"🌱 " + note, right:`NDVI ${curV.toFixed(2)} · SAVI ${f.__savi.toFixed(2)}` });
    }
    lines.slice(0,3).forEach((ln,i)=>{
      const ly = y + i*40;
      x.font="700 24px system-ui,sans-serif"; x.fillStyle="#14261B"; x.textAlign="left";
      x.fillText(ln.text, pad, ly);
      if(ln.right){
        x.font="800 24px system-ui,sans-serif"; x.fillStyle="#6b7b70"; x.textAlign="right";
        x.fillText(ln.right, W-pad, ly);
        x.textAlign="left";
      }
    });
    y += 130;

    // footer
    x.strokeStyle="#D9D2C2"; x.beginPath(); x.moveTo(pad,y); x.lineTo(W-pad,y); x.stroke();
    x.fillStyle="#1E6E5A"; x.font="800 24px system-ui,sans-serif";
    x.fillText("iraqfarmshealth.com", pad, y+18);
    x.fillStyle="#8a9790"; x.font="500 18px system-ui,sans-serif";
    x.fillText("Sentinel-2 · Esri · Fields of the World", pad, y+50);

    const blob = await new Promise(res=> cv.toBlob(res, "image/png"));
    await shareOrDownloadImage(blob, `iraq-farms-health-${id||"field"}.png`);
  }catch(err){
    console.warn("report:", err.message);
    alert("Could not build the report image.");
  }
}
/* Collect the tapped field plus nearby fields (for the report's context panel),
   each with its cached health colour if we have one. */
function collectContextFields(f){
  const myKey = fieldKey(f);
  let feats = [];
  try{ feats = map.queryRenderedFeatures({layers:["fields-fill"]}); }catch{ feats=[]; }
  const seen = new Set(); const out = [];
  for(const nf of feats){
    const k = fieldKey(nf);
    if(seen.has(k)) continue; seen.add(k);
    const cached = __healthCache.get(k);
    out.push({ geometry:nf.geometry, key:k,
               col: (cached && cached.col) ? cached.col : null,
               isSubject: k===myKey });
  }
  // make sure the subject field is present even if not in the rendered set
  if(!out.some(o=>o.isSubject)){
    const cached = __healthCache.get(myKey);
    out.push({ geometry:f.geometry, key:myKey,
               col:(cached&&cached.col)?cached.col:null, isSubject:true });
  }
  return out;
}

/* Draw the field-context panel: neighbouring fields filled by health colour,
   the subject field outlined boldly so the farmer sees "that's mine". Projects
   lon/lat to the panel box using a shared bbox so shapes aren't distorted. */
function drawFieldContext(ctx, subject, fields, ox, oy, w, h){
  // bounding box over subject + neighbours, with a little padding
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const bb = geomBbox(subject.geometry);
  // Center on the subject but include neighbours within a reasonable window.
  const cx=(bb[0]+bb[2])/2, cy=(bb[1]+bb[3])/2;
  const latScale = Math.cos(cy*Math.PI/180) || 1;
  const subSpan = Math.max((bb[2]-bb[0])*latScale, bb[3]-bb[1]);
  // Window sized to the panel's aspect ratio so fields fill it (no dead space).
  const panelAR = w/h;                       // wide panel
  const halfY = Math.max(subSpan*2.2, 0.006);
  const halfX = halfY*panelAR;               // wider in x to match the box
  const scale = Math.min( w/(2*halfX), h/(2*halfY) );
  const offX = ox + w/2, offY = oy + h/2;
  const proj = (lon,lat)=>[ offX + (lon-cx)*latScale*scale, offY - (lat-cy)*scale ];

  function pathGeom(g){
    const polys = g.type==="MultiPolygon" ? g.coordinates : [g.coordinates];
    ctx.beginPath();
    for(const poly of polys){
      for(const ring of poly){
        ring.forEach((pt,i)=>{ const [px,py]=proj(pt[0],pt[1]); if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); });
        ctx.closePath();
      }
    }
  }
  // neighbours first
  for(const fl of fields){
    if(fl.isSubject) continue;
    pathGeom(fl.geometry);
    if(fl.col){
      ctx.fillStyle = fl.col; ctx.globalAlpha = 0.82; ctx.fill(); ctx.globalAlpha = 1;
    }else{
      // uncoloured: a soft, low-contrast tone that reads as "land" not "broken"
      ctx.fillStyle = "#cdc4b0"; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle="rgba(255,255,255,0.45)"; ctx.lineWidth=1; ctx.stroke();
  }
  // subject on top, bold outline: light halo first, dark line over it so it
  // reads clearly against any neighbour colour.
  const subj = fields.find(fl=>fl.isSubject) || {geometry:subject.geometry, col:null};
  pathGeom(subj.geometry);
  ctx.fillStyle = subj.col || "rgba(30,110,90,0.35)";
  ctx.globalAlpha = subj.col ? 0.95 : 1; ctx.fill(); ctx.globalAlpha=1;
  ctx.lineJoin="round";
  ctx.strokeStyle="#F4F1E9"; ctx.lineWidth=6; ctx.stroke();   // halo underneath
  ctx.strokeStyle="#14261B"; ctx.lineWidth=3; ctx.stroke();   // dark line on top
}

function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function roundRectPath(x,rx,ry,w,h,r){ x.beginPath(); x.moveTo(rx+r,ry); x.arcTo(rx+w,ry,rx+w,ry+h,r); x.arcTo(rx+w,ry+h,rx,ry+h,r); x.arcTo(rx,ry+h,rx,ry,r); x.arcTo(rx,ry,rx+w,ry,r); x.closePath(); }
async function shareOrDownloadImage(blob, filename){
  const file = new File([blob], filename, {type:"image/png"});
  // Prefer the native share sheet — it offers "Save Image" (straight to Photos,
  // easy to find) plus WhatsApp/Messages/Mail. Only fall back to a plain download
  // when file-sharing genuinely isn't supported. Critically, if the user OPENS
  // the share sheet and cancels it (AbortError), we do NOT fall back — that would
  // wrongly trigger a second download prompt.
  const canShareFiles = !!(navigator.canShare && navigator.canShare({files:[file]}));
  if(canShareFiles){
    try{
      await navigator.share({ files:[file], title:"Iraq Farms Health" });
      return;                                  // shared (or handled) — done
    }catch(e){
      if(e && e.name === "AbortError") return;  // user dismissed — respect that, no download
      // any other error: sharing failed for real → fall through to download
    }
  }
  // Fallback: direct download (Files app). Used only when sharing is unavailable.
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a);
  a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* Compare newest filled month to same month a year before.
   NDVI percentage change is meaningless on a near-zero base (bare soil),
   so we report the ABSOLUTE difference in NDVI points, and only add a
   percentage when both values are high enough for it to mean something. */
/* Year-on-year by AREA UNDER THE CURVE, not single-month matching.
   Rationale: on a seasonal crop, this-July vs last-July compares two bare-soil
   troughs and misses that one whole season outgrew the other. Instead we
   integrate NDVI across each 12-month block (trapezoid rule over month index)
   and NORMALISE by the span actually covered, so a year with data gaps isn't
   unfairly penalised. The result is effectively mean growing-season vigour. */
function seasonIntegral(hist, from, to){
  // collect (x=month index, v) points that have data, in order
  const pts = [];
  for(let i=from;i<=to;i++){ const s=hist[i]; if(s && s.v!=null) pts.push([i, s.v]); }
  if(pts.length<2) return pts.length===1 ? {mean:pts[0][1], cover:0} : null;
  let area=0, span=0;
  for(let k=1;k<pts.length;k++){
    const dx = pts[k][0]-pts[k-1][0];
    area += (pts[k][1]+pts[k-1][1])/2 * dx;  // trapezoid
    span += dx;
  }
  return {mean: area/span, cover: span};    // area normalised by covered span
}

function computeYoY(hist){
  const t = I18N[lang];
  const n = hist.length;
  if(n<24) return {text:"—",color:"var(--ink)",msg:"",diff:null};
  const thisYr = seasonIntegral(hist, n-12, n-1);   // last 12 months
  const lastYr = seasonIntegral(hist, n-24, n-13);  // the 12 before that
  if(!thisYr || !lastYr) return {text:"—",color:"var(--ink)",msg:"",diff:null};
  // require each block to have a few months of coverage to be trustworthy
  if(thisYr.cover<4 || lastYr.cover<4) return {text:"—",color:"var(--ink)",msg:"",diff:null};

  const diff = thisYr.mean - lastYr.mean;           // difference of mean NDVI
  const arrow = diff>0.03 ? "↑" : diff<-0.03 ? "↓" : "≈";
  const color = diff>0.03 ? "var(--canal)" : diff<-0.03 ? "var(--clay)" : "var(--wheat)";
  // Percentages are only meaningful when BOTH years have real vegetation. On a
  // near-bare field last year, dividing by a tiny base explodes the ratio
  // (e.g. +4,568,031%). So: require a solid base (>=0.20), and even then cap the
  // displayed percentage — beyond that we show the absolute NDVI change instead,
  // which is always honest.
  const PCT_CAP = 300;
  const rawPct = lastYr.mean>=0.20 ? Math.round((diff/lastYr.mean)*100) : null;
  const usePct = rawPct!=null && Math.abs(rawPct) <= PCT_CAP;
  const pct = usePct ? rawPct : null;
  const magnitude = usePct ? `${pct>0?"+":""}${pct}%`
                           : `${diff>0?"+":""}${diff.toFixed(2)}`;
  const text = `${arrow} ${magnitude}`;
  const msg = diff>0.03 ? t.yoyUp : diff<-0.03 ? t.yoyDown : t.yoySame;
  return {text,color,msg,diff,pct};
}

/* Draw a two-row (per-year) monthly NDVI table with health-coloured cells.
   Returns the pixel height drawn. Empty months show a subtle "–". */
function drawNdviTable(x, hist, ox, oy, w){
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const years=[...new Set(hist.map(s=>s.year))].sort();
  const labelW=64, cellW=(w-labelW)/12, headH=30, rowH=52, gap=6;
  let y=oy;
  x.textAlign="center"; x.font="700 18px system-ui,sans-serif"; x.fillStyle="#8a9790";
  for(let m=0;m<12;m++){ x.fillText(MON[m], ox+labelW+cellW*m+cellW/2, y+6); }
  y+=headH;
  for(const yr of years){
    x.textAlign="left"; x.font="800 20px system-ui,sans-serif"; x.fillStyle="#14261B";
    x.fillText(String(yr), ox+4, y+rowH/2-16);
    for(let m=0;m<12;m++){
      const slot=hist.find(s=>s.year===yr && s.monthIdx===m);
      const cx=ox+labelW+cellW*m, cw=cellW-gap;
      if(slot && slot.v!=null){
        const val=slot.v;
        x.fillStyle=ndviColorHex(val);
        roundRectPath(x, cx, y, cw, rowH-gap, 8); x.fill();
        x.fillStyle = (val>=0.2 && val<0.45) ? "#3a2c10" : "#fff";   // contrast on wheat
        x.font="800 19px system-ui,sans-serif"; x.textAlign="center";
        x.fillText(val.toFixed(2), cx+cw/2, y+rowH/2-16);
      } else {
        x.fillStyle="#ece8dc";
        roundRectPath(x, cx, y, cw, rowH-gap, 8); x.fill();
        x.fillStyle="#b8b3a2"; x.font="700 16px system-ui,sans-serif"; x.textAlign="center";
        x.fillText("–", cx+cw/2, y+rowH/2-14);
      }
    }
    y+=rowH;
  }
  x.textAlign="left";
  return y-oy;
}

/* Draw the NDVI history chart onto an arbitrary canvas context at (ox,oy) with
   size (w,h). A standalone version of drawSpark used by the shareable report. */
function drawSparkOnto(ctx, hist, ox, oy, w, h){
  const n = hist.length; if(!n) return;
  const P = 8;
  const x = i => ox + P + (w-2*P)*(i/(n-1));
  const y = v => oy + h - P - (h-2*P)*Math.max(0,Math.min(1,(v+0.2)/1.0));
  // gridlines
  ctx.strokeStyle="#E4DCC8"; ctx.lineWidth=1;
  [0.2,0.45].forEach(g=>{ ctx.beginPath(); ctx.moveTo(ox+P,y(g)); ctx.lineTo(ox+w-P,y(g)); ctx.stroke(); });
  // year dividers
  ctx.textAlign="center"; ctx.font="600 14px system-ui,sans-serif";
  for(let i=0;i<n;i++){
    if(hist[i] && hist[i].monthIdx===0){
      const px=x(i);
      ctx.strokeStyle="#D8CFB8"; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(px,oy+4); ctx.lineTo(px,oy+h-4); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="#6B6350"; ctx.fillText(String(hist[i].year), px, oy-2);
    }
  }
  function seg(from,to,alpha,width){
    ctx.strokeStyle=`rgba(30,110,90,${alpha})`; ctx.lineWidth=width; ctx.lineJoin="round";
    ctx.beginPath(); let started=false;
    for(let i=from;i<=to;i++){ const s=hist[i]; if(!s||s.v==null){started=false;continue;}
      const px=x(i),py=y(s.v); if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py); }
    ctx.stroke();
  }
  if(n>12) seg(0,12,0.28,2.5);
  seg(Math.max(0,n-13),n-1,1,3.5);
  for(let i=0;i<n;i++){ const s=hist[i]; if(!s||s.v==null) continue;
    ctx.fillStyle=ndviColorHex(s.v); ctx.beginPath(); ctx.arc(x(i),y(s.v),(i>=n-12?4.5:3),0,7); ctx.fill(); }
  ctx.textAlign="start";
}

/* Health band -> the app's brand colour (for the report stat card). */
function bandColor(band){
  return band==="good" ? "#1E6E5A" : band==="fair" ? "#D9A441" : band==="poor" ? "#B4552D" : "#14261B";
}

function drawSpark(hist){
  const cv = document.getElementById("spark"); if(!cv) return;
  const ctx = cv.getContext("2d");
  // Match the canvas backing store to its real on-screen size (x DPR for sharpness),
  // otherwise a fixed 640-wide buffer stretched across a wide sheet distorts text.
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  const W = Math.max(320, Math.round(rect.width));
  const H = Math.round(rect.height) || 96;
  cv.width = Math.round(W*dpr);
  cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);   // draw in CSS-pixel coordinates
  const P=20;
  ctx.clearRect(0,0,W,H);
  const n = hist.length;
  const x = i => P + (W-2*P)*(i/(n-1));
  const y = v => H-P - (H-2*P)*Math.max(0,Math.min(1,(v+0.2)/1.0));

  // faint gridline at NDVI 0.45 (fair/good) and 0.2 (poor/fair)
  ctx.strokeStyle="#E4DCC8"; ctx.lineWidth=1;
  [0.2,0.45].forEach(g=>{ ctx.beginPath(); ctx.moveTo(P,y(g)); ctx.lineTo(W-P,y(g)); ctx.stroke(); });

  // Vertical dividers at each January (year boundaries), with the year number.
  ctx.textAlign="center"; ctx.font="600 10px ui-sans-serif,system-ui";
  for(let i=0;i<n;i++){
    if(hist[i] && hist[i].monthIdx===0){        // January
      const px = x(i);
      ctx.strokeStyle="#D8CFB8"; ctx.lineWidth=1;
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(px,P-4); ctx.lineTo(px,H-16); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle="#6B6350";
      ctx.fillText(String(hist[i].year), px, P-8<12?12:P-8);
    }
  }

  // split the series at the 12-month boundary: last 12 = this year (solid),
  // first 12 = last year (faded), so the two cycles are visually comparable.
  function drawSeg(from,to,alpha,width){
    ctx.strokeStyle=`rgba(30,110,90,${alpha})`; ctx.lineWidth=width; ctx.lineJoin="round";
    ctx.beginPath(); let started=false;
    for(let i=from;i<=to;i++){
      const s=hist[i]; if(!s||s.v==null){started=false;continue;}
      const px=x(i),py=y(s.v);
      if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  if(n>12) drawSeg(0,12,0.28,2);      // last year, faded
  drawSeg(Math.max(0,n-13),n-1,1,2.5); // this year, solid

  // dots colored by health band; also record screen positions for hover hit-testing.
  __sparkDots = [];
  for(let i=0;i<n;i++){
    const s=hist[i]; if(!s||s.v==null) continue;
    const cx=x(i), cy=y(s.v), r=(i>=n-12?3.2:2.2);
    ctx.fillStyle=ndviColorHex(s.v);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
    __sparkDots.push({i, cx, cy, v:s.v, label:s.label, year:s.year, date:s.date, scene:s.scene, cloud:s.cloud, thisYear:i>=n-12});
  }
  // Highlight the hovered dot with a ring.
  if(__hoverDot!=null){
    const d = __sparkDots.find(d=>d.i===__hoverDot);
    if(d){
      ctx.strokeStyle="#14261B"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(d.cx,d.cy,6,0,7); ctx.stroke();
    }
  }

  // month labels: every 3rd
  ctx.fillStyle="#8A8064"; ctx.font="10px ui-sans-serif,system-ui"; ctx.textAlign="center";
  for(let i=0;i<n;i+=3){ if(hist[i]) ctx.fillText(hist[i].label, x(i), H-4); }

  // "last year" / "this year" captions over the two halves (localized)
  const t = I18N[lang];
  ctx.font="700 10px ui-sans-serif,system-ui"; ctx.textAlign="center";
  if(n>12){
    ctx.fillStyle="rgba(120,110,88,.85)";
    ctx.fillText(t.lastYr, x(5), P+2);            // mid of first 12
  }
  ctx.fillStyle="rgba(30,110,90,.95)";
  ctx.fillText(t.thisYr, x(Math.max(0,n-8)), P+2); // mid of last 12
}
function ndviColorHex(v){
  if(v<0.2) return "#B4552D";
  if(v<0.45) return "#D9A441";
  return "#1E6E5A";
}

/* ---- Verification links ----
   Two complementary links per reading:
   (A) appVerifyUrl  — Copernicus Browser app, centred on the field at the scene
       date with the built-in NDVI layer, for anyone who wants to explore. The
       app does NOT support drawing an AOI polygon from the URL (confirmed against
       CDSE docs — AOI is an in-app/upload-only action), so we don't pretend to.
   (B) wmsImageUrl   — a direct WMS GetMap image that renders the SAME NDVI over
       the SAME scene date with the farmer's field boundary burned in via the
       GEOMETRY parameter. No login, no navigation: it's a picture of exactly
       this field's NDVI, outlined. Requires a free Sentinel Hub instance id
       (paste yours into SH_INSTANCE_ID below); until then this link is hidden. */

const SH_INSTANCE_ID = ""; // <-- paste your free CDSE Sentinel Hub instance ID here

function appVerifyUrl(lat, lon, date){
  if(!date) return null;
  const p = new URLSearchParams({
    zoom:"15",
    lat:lat.toFixed(4),
    lng:lon.toFixed(4),
    datasetId:"S2_L2A_CDAS",
    layerId:"3_NDVI",
    fromTime:`${date}T00:00:00.000Z`,
    toTime:`${date}T23:59:59.999Z`
  });
  return `https://dataspace.copernicus.eu/browser/?${p.toString()}`;
}

/* Direct NDVI image of the field, outline burned in. Renders only if an
   instance id is configured. Uses a bbox padded around the polygon. */
function wmsImageUrl(geometry, date){
  if(!SH_INSTANCE_ID || !geometry || !date) return null;
  const wkt = polygonToWkt(geometry, 40);
  if(!wkt) return null;
  const bb = geomBbox(geometry);
  if(!bb) return null;
  // pad bbox ~15% so the outline isn't flush to the image edge
  const padX=(bb[2]-bb[0])*0.15, padY=(bb[3]-bb[1])*0.15;
  const bbox=[bb[0]-padX, bb[1]-padY, bb[2]+padX, bb[3]+padY].join(",");
  const p = new URLSearchParams({
    SERVICE:"WMS", REQUEST:"GetMap", VERSION:"1.3.0",
    LAYERS:"NDVI", FORMAT:"image/png",
    WIDTH:"600", HEIGHT:"600", CRS:"EPSG:4326",
    TIME:`${date}/${date}`,
    BBOX:bbox,
    GEOMETRY:wkt
  });
  return `https://sh.dataspace.copernicus.eu/ogc/wms/${SH_INSTANCE_ID}?${p.toString()}`;
}

/* Convert a GeoJSON Polygon/MultiPolygon outer ring to a WKT POLYGON string,
   down-sampled to at most maxPts vertices to keep the URL short. */
function polygonToWkt(g, maxPts){
  if(!g) return null;
  let ring;
  if(g.type==="Polygon") ring=g.coordinates[0];
  else if(g.type==="MultiPolygon") ring=g.coordinates[0][0];
  else return null;
  if(!ring || ring.length<4) return null;
  // even down-sample, always keeping first & last (closure)
  let pts = ring;
  if(ring.length>maxPts){
    const step = Math.ceil(ring.length/maxPts);
    pts = ring.filter((_,i)=> i%step===0);
    const last = ring[ring.length-1];
    if(pts[pts.length-1][0]!==last[0] || pts[pts.length-1][1]!==last[1]) pts.push(last);
  }
  // ensure closed
  const f=pts[0], l=pts[pts.length-1];
  if(f[0]!==l[0] || f[1]!==l[1]) pts.push(f);
  const coords = pts.map(p=>`${p[0].toFixed(5)} ${p[1].toFixed(5)}`).join(",");
  return `POLYGON((${coords}))`;
}

/* Show the month's NDVI value when the user hovers (desktop) or taps/drags
   (mobile) over a dot on the sparkline. Canvas has no DOM nodes to hover,
   so we hit-test pointer position against the recorded dot positions.
   A TAP pins a provenance panel (scene id + independent verify link). */
function attachSparkHover(hist){
  const cv = document.getElementById("spark");
  const wrap = document.getElementById("spark-wrap");
  const tip = document.getElementById("spark-tip");
  const prov = document.getElementById("spark-prov");
  if(!cv||!wrap||!tip) return;
  const t = I18N[lang];

  function pick(clientX, clientY){
    const rect = cv.getBoundingClientRect();
    const px = clientX-rect.left, py = clientY-rect.top;
    let best=null, bestD=Infinity;
    for(const d of __sparkDots){
      const dx=d.cx-px, dy=d.cy-py, dist=dx*dx+dy*dy;
      if(dist<bestD){ bestD=dist; best=d; }
    }
    if(best && Math.abs(best.cx-px) <= 18) return best;
    return null;
  }
  function show(d){
    if(!d){ hide(); return; }
    if(__hoverDot!==d.i){ __hoverDot=d.i; drawSpark(hist); }
    tip.innerHTML = `<span class="tv">${d.v.toFixed(2)}</span>`+
      `<div class="td">${d.label} ${d.year}${d.date?" · "+d.date:""}</div>`;
    tip.style.left = d.cx+"px";
    tip.style.top  = d.cy+"px";
    tip.hidden = false;
  }
  function hide(){
    if(__hoverDot!=null && !__pinnedDot){ __hoverDot=null; drawSpark(hist); }
    tip.hidden = true;
  }
  // Pin a provenance panel for the tapped point.
  function pin(d){
    if(!d || !prov){ if(prov) prov.hidden=true; __pinnedDot=null; return; }
    __pinnedDot = d.i; __hoverDot = d.i; drawSpark(hist);
    const c = lastField ? polyCentroid(lastField.geometry) : null;
    const appUrl = c ? appVerifyUrl(c[1], c[0], d.date) : null;
    const imgUrl = wmsImageUrl(lastField && lastField.geometry, d.date);
    prov.innerHTML =
      `<div class="pv-row"><b>${d.v.toFixed(2)}</b> NDVI · ${d.label} ${d.year}${d.date?" · "+d.date:""}</div>`+
      (d.scene?`<div class="pv-scene">${t.source}: ${d.scene}</div>`:"")+
      (d.cloud!=null?`<div class="pv-scene">${t.cloud}: ${Math.round(d.cloud)}%</div>`:"")+
      `<div class="pv-links">`+
        (imgUrl?`<a class="pv-link pv-primary" href="${imgUrl}" target="_blank" rel="noopener">${t.viewField} ↗</a>`:"")+
        (appUrl?`<a class="pv-link" href="${appUrl}" target="_blank" rel="noopener">${t.verify} ↗</a>`:"")+
      `</div>`+
      `<button class="pv-close" aria-label="close">×</button>`;
    prov.hidden = false;
    const cb = prov.querySelector(".pv-close");
    if(cb) cb.onclick = ()=>{ prov.hidden=true; __pinnedDot=null; __hoverDot=null; drawSpark(hist); };
  }

  // Mouse (desktop): hover peeks value, click pins provenance
  cv.onmousemove = e => { if(!__pinnedDot) show(pick(e.clientX, e.clientY)); };
  cv.onmouseleave = () => { if(!__pinnedDot) hide(); };
  cv.onclick = e => { const d=pick(e.clientX,e.clientY); if(d){ show(d); pin(d);} };
  // Touch (mobile): drag peeks values, a tap pins provenance
  cv.ontouchstart = e => { const tt=e.touches[0]; if(tt) show(pick(tt.clientX,tt.clientY)); };
  cv.ontouchmove  = e => { const tt=e.touches[0]; if(tt){ e.preventDefault(); show(pick(tt.clientX,tt.clientY)); } };
  cv.ontouchend   = e => {
    const tt=e.changedTouches&&e.changedTouches[0];
    const d = tt? pick(tt.clientX,tt.clientY):null;
    if(d) pin(d); else setTimeout(()=>{ if(!__pinnedDot) hide(); }, 1200);
  };
}
function healthBand(v){
  if(v==null) return null;
  if(v<0.2) return "poor";
  if(v<0.45) return "fair";
  return "good";
}
function geoLabel(f){
  const c = polyCentroid(f.geometry);
  return c ? `lat ${c[1].toFixed(4)}, lon ${c[0].toFixed(4)}` : "";
}
/* The global FTW PMTiles carry geometry only — the fiboa `id`/`area` columns
   from the source GeoParquet are dropped when tiled for browser display.
   So we derive a STABLE field code from the polygon's centroid: the same
   field always hashes to the same short code, across sessions, with no
   attributes needed. Format: FTW-XXXXXX (base36 of a centroid hash). */
function resolveFieldId(f){
  const c = polyCentroid(f.geometry);
  if(!c) return null;
  // quantize to ~1m so tiny float differences don't change the code
  const key = `${c[0].toFixed(5)},${c[1].toFixed(5)}`;
  let h = 2166136261;                    // FNV-1a
  for(let i=0;i<key.length;i++){ h ^= key.charCodeAt(i); h = Math.imul(h,16777619); }
  const code = (h>>>0).toString(36).toUpperCase().padStart(6,"0").slice(0,6);
  return "FTW-"+code;
}
function fieldLabel(f){
  const id = resolveFieldId(f);
  if(id==null) return "";
  return `${I18N[lang].field} ${id}  ·  `;
}
function ndviColor(v){
  if(v==null) return "var(--ink)";
  if(v<0.2) return "var(--clay)";
  if(v<0.45) return "var(--wheat)";
  return "var(--canal)";
}
function polyCentroid(g){
  try{
    let ring;
    if(g.type==="Polygon") ring=g.coordinates[0];
    else if(g.type==="MultiPolygon") ring=g.coordinates[0][0];
    else return null;
    let x=0,y=0;ring.forEach(p=>{x+=p[0];y+=p[1];});
    return [x/ring.length,y/ring.length];
  }catch{return null;}
}

// --- Find my location -------------------------------------------------------
// Farmer-facing entry point for people who don't know their field ID or
// coordinates: press the button, the map flies to where they're standing.
// Uses the browser geolocation API directly (no extra library) and reuses the
// existing #zoom-hint bubble to show status/errors in the current language.
// A single reusable marker shows the located point. All three failure modes
// (permission denied, position unavailable, timeout) get a plain-language,
// translated message that also points users to the search box as a fallback.
(function(){
  const btn = document.getElementById("locate-fab");
  if(!btn) return;
  const toast = document.getElementById("locate-toast");
  let toastTimer = null, meMarker = null;

  // Show a status message in the dedicated locate toast; auto-hide after `ms`
  // (0 = leave visible until replaced). Kept separate from #zoom-hint so it
  // never clobbers that bubble's translated text.
  function say(msg, ms){
    if(!toast) return;
    toast.textContent = msg;
    toast.hidden = false;
    clearTimeout(toastTimer);
    if(ms){ toastTimer = setTimeout(()=>{ toast.hidden = true; }, ms); }
  }

  btn.addEventListener("click", ()=>{
    const t = I18N[lang];
    if(!("geolocation" in navigator)){ say(t.locateFail, 6000); return; }
    say(t.locating, 0);
    btn.classList.remove("active");
    btn.classList.add("locating");   // spinner + pulsing halo
    btn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        btn.disabled = false;
        btn.classList.remove("locating");
        btn.classList.add("active");  // solid green = we have your location
        const lon = pos.coords.longitude, lat = pos.coords.latitude;
        // Zoom to a level where field polygons are tappable (>= FTW_MIN_ZOOM).
        map.flyTo({center:[lon,lat], zoom:15, duration:1200});
        if(!meMarker){
          meMarker = new maplibregl.Marker({color:"#1E6E5A"});
        }
        meMarker.setLngLat([lon,lat]).addTo(map);
        say(t.locateOk, 5000);
      },
      (err)=>{
        btn.disabled = false;
        btn.classList.remove("locating");
        // 1 = PERMISSION_DENIED, 2 = POSITION_UNAVAILABLE, 3 = TIMEOUT
        say(err && err.code===1 ? t.locateDenied : t.locateFail, 8000);
      },
      { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
    );
  });

  // Once the user pans away from their located spot, the "active" state no
  // longer reflects the view centre — drop it so the button reads as neutral.
  map.on("dragstart", ()=>btn.classList.remove("active"));
})();

function renderHistory(){
  const t = I18N[lang];
  const arr = loadHistory();
  histCount.textContent = arr.length ? `(${arr.length})` : "";
  if(!histList) return;
  // Rank: fields with a real improvement value first (biggest gain -> top),
  // then fields whose improvement couldn't be computed, by recency.
  const ranked = arr.slice().sort((a,b)=>{
    const av = (typeof a.improve==="number"), bv = (typeof b.improve==="number");
    if(av && bv) return b.improve - a.improve;
    if(av) return -1; if(bv) return 1;
    return (b.when||0)-(a.when||0);
  });
  histList.innerHTML = "";
  histEmpty.style.display = ranked.length ? "none" : "block";
  const medals = ["🥇","🥈","🥉"];
  ranked.forEach((e,i)=>{
    const row = document.createElement("div");
    row.className = "hrow";
    const col = e.band ? ({poor:"#B4552D",fair:"#D9A441",good:"#1E6E5A"}[e.band]||"#C9BFA8") : "#C9BFA8";
    const rank = medals[i] || (i+1);
    let imp = "—", impColor = "var(--ink)";
    if(typeof e.improve==="number"){
      const up = e.improve>0.03, down = e.improve<-0.03;
      const arrow = up?"↑":down?"↓":"≈";
      // Match the field sheet: show a percentage when it's meaningful (stored
      // when the base wasn't near-zero), otherwise the absolute NDVI change.
      const mag = (typeof e.improvePct==="number")
        ? `${e.improvePct>0?"+":""}${e.improvePct}%`
        : `${e.improve>0?"+":""}${e.improve.toFixed(2)}`;
      imp = `${arrow} ${mag}`;
      impColor = up?"var(--canal)":down?"var(--clay)":"var(--wheat)";
    }
    row.innerHTML =
      `<div class="hrank">${rank}</div>`+
      `<span class="hsw" style="background:${col}"></span>`+
      `<div class="hbody"><div class="hid">${e.id}</div>`+
      `<div class="hsub">${t.improveLabel} · lat ${e.lat.toFixed(3)}, lon ${e.lon.toFixed(3)}</div></div>`+
      `<div class="himp" style="color:${impColor}">${imp}</div>`;
    row.addEventListener("click",()=>{ histPanel.hidden = true; flyToField(e.lon, e.lat); });
    histList.appendChild(row);
  });
}

/* Fly to a location, then select+open the field under that point once tiles load. */
function flyToField(lon, lat){
  map.flyTo({center:[lon,lat], zoom:15, duration:800});
  const tryTap = ()=>{
    const pt = map.project([lon,lat]);
    const feats = map.queryRenderedFeatures(pt, {layers:["fields-fill"]});
    if(feats && feats.length){
      onFieldTap({features:[feats[0]]});
      return true;
    }
    return false;
  };
  // attempt a few times as tiles settle
  let tries=0;
  const iv = setInterval(()=>{
    if(tryTap() || ++tries>12){ clearInterval(iv); }
  }, 400);
  map.once("moveend", ()=>setTimeout(tryTap, 300));
}

/* Search: accept "lat, lon" or a field id (FTW-XXXXXX). */
const searchInput = document.getElementById("search-input");
function doSearch(){
  const q = (searchInput.value||"").trim();
  if(!q) return;
  // Coordinate form "lat, lon" (matching Google Maps / OSM order and how the app
  // now displays coordinates everywhere). Accepts comma or space separated.
  const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m){
    const lat=parseFloat(m[1]), lon=parseFloat(m[2]);
    if(isFinite(lat)&&isFinite(lon)){ flyToField(lon, lat); return; }
  }
  // Field-id form. The FTW code is a one-way hash of the centroid, so it can
  // only be resolved for fields we've already stored: saved pins OR history
  // (every opened field is auto-logged). Look in both.
  const id = q.toUpperCase().startsWith("FTW-") ? q.toUpperCase() : "FTW-"+q.toUpperCase();
  const found = loadPins().find(p=>p.id===id) || loadHistory().find(e=>e.id===id);
  if(found){ flyToField(found.lon, found.lat); return; }
  showErr(I18N[lang].notFound);
  setTimeout(()=>{ errBox.style.display="none"; }, 4500);
}
document.getElementById("search-go").addEventListener("click", doSearch);
searchInput.addEventListener("keydown",e=>{ if(e.key==="Enter") doSearch(); });

/* ---------- first-run interactive tour ----------
   Gated flow: the user must actually TAP a field to proceed, then watches the
   real chart populate live. Steps that require an action hide the Next button. */
const TOUR_KEY = "iraqFarmHealth.tourSeen.v1";
const TOUR_FIELD = {lon:43.1995, lat:36.2282};
const tourEl = document.getElementById("tour");
const tourHole = document.getElementById("tour-hole");
const tourCard = document.getElementById("tour-card");
const tourTextEl = document.getElementById("tour-text");
const tourStepEl = document.getElementById("tour-step");
const tourDotsEl = document.getElementById("tour-dots");
const tourNextBtn = document.getElementById("tour-next");
const tourSkipBtn = document.getElementById("tour-skip");
let tourIdx = 0, tourActive = false;

// gate: "tap" waits for a field tap; "chart" waits for data to start filling; else Next.
const TOUR_STEPS = [
  {key:"t1", target:"center"},
  {key:"t2", target:"field", gate:"tap"},
  {key:"t3", target:"#stat"},
  {key:"t4", target:"#spark-wrap", gate:"chart"},
  {key:"t5", target:"#health-toggle"},
  {key:"t6", target:"#tools"}
];

function startTour(){
  tourActive = true; tourIdx = 0;
  if(sheet.classList.contains("open")){ // reset any open field
    sheet.classList.remove("open");
    const s=map.getSource("sel"); if(s) s.setData({type:"FeatureCollection",features:[]});
  }
  // Jump INSTANTLY to the sample field (no animation) so the very first frame
  // the user sees is already the correct view.
  map.jumpTo({center:[TOUR_FIELD.lon, TOUR_FIELD.lat], zoom:14.8});
  tourEl.hidden = false;
  // First: let the user pick their language, so the guide isn't a wall of
  // English to an Arabic/Kurdish speaker. Then run the localized steps.
  requestAnimationFrame(()=> requestAnimationFrame(()=> showLangChooser()));
}

/* Language chooser shown as the tour's very first screen. */
function showLangChooser(){
  tourHole.style.display="none";           // no spotlight on this screen
  tourStepEl.textContent = "";
  tourDotsEl.innerHTML = "";
  tourNextBtn.style.display="none";
  tourSkipBtn.style.display="none";
  tourEl.classList.remove("pass");
  tourTextEl.innerHTML =
    `<div class="tour-lang-q">Choose your language · اختر لغتك · زمانەکەت هەڵبژێرە</div>`+
    `<div class="tour-lang-btns">`+
      `<button data-l="en">English</button>`+
      `<button data-l="ar">عربي</button>`+
      `<button data-l="ku">کوردی</button>`+
    `</div>`;
  tourTextEl.querySelectorAll(".tour-lang-btns button").forEach(b=>{
    b.addEventListener("click",()=>{
      applyLang(b.dataset.l);              // switch whole app + tour to that language
      tourNextBtn.style.display="";
      tourSkipBtn.style.display="";
      showTourStep(0);
    });
  });
  // centre the card for this screen
  positionCard(null);
}

function positionCard(rect){
  const cw = Math.min(340, window.innerWidth*0.88);
  const margin = 12;
  let left = rect ? rect.left + rect.width/2 - cw/2 : window.innerWidth/2 - cw/2;
  left = Math.max(margin, Math.min(left, window.innerWidth - cw - margin));
  tourCard.style.width = cw+"px";
  tourCard.style.left = left+"px";
  const cardH = tourCard.offsetHeight || 170;
  if(rect && rect.bottom + cardH + margin < window.innerHeight){
    tourCard.style.top = (rect.bottom + margin)+"px";
  } else if(rect && rect.top - cardH - margin > 0){
    tourCard.style.top = (rect.top - cardH - margin)+"px";
  } else {
    tourCard.style.top = (window.innerHeight - cardH - margin)+"px";
  }
}

function highlight(target){
  let rect = null;
  if(target==="center" || target==="field"){
    const pt = map.project([TOUR_FIELD.lon, TOUR_FIELD.lat]);
    const size = 190;
    rect = {left:pt.x-size/2, top:pt.y-size/2, width:size, height:size,
            bottom:pt.y+size/2, right:pt.x+size/2};
  } else {
    const el = document.querySelector(target);
    if(el){ const r = el.getBoundingClientRect();
      rect = {left:r.left-6, top:r.top-6, width:r.width+12, height:r.height+12,
              bottom:r.bottom+6, right:r.right+6}; }
  }
  if(rect){
    tourHole.style.display="block";
    tourHole.style.left=rect.left+"px"; tourHole.style.top=rect.top+"px";
    tourHole.style.width=rect.width+"px"; tourHole.style.height=rect.height+"px";
  } else { tourHole.style.display="none"; }
  return rect;
}

function showTourStep(i){
  const t = I18N[lang];
  const step = TOUR_STEPS[i];
  tourIdx = i;
  tourStepEl.textContent = `${t.tourStep} ${i+1} / ${TOUR_STEPS.length}`;
  tourTextEl.textContent = t[step.key];
  tourDotsEl.innerHTML = TOUR_STEPS.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join("");

  // A "tap" gate hides Next and lets the map receive the tap; the spotlight
  // pulses over the field. Advancing happens via __onTourFieldTap.
  if(step.gate==="tap"){
    tourNextBtn.style.display="none";
    tourHole.classList.add("pulse");
    tourEl.classList.add("pass");           // let taps reach the map through the dim
    window.__onTourFieldTap = ()=>{
      window.__onTourFieldTap = null;
      tourEl.classList.remove("pass");
      tourHole.classList.remove("pulse");
      // move on to the chart step once the sheet is opening
      setTimeout(()=>showTourStep(i+1), 500);
    };
  } else {
    tourNextBtn.style.display="";
    tourHole.classList.remove("pulse");
    tourEl.classList.remove("pass");
    tourNextBtn.textContent = (i===TOUR_STEPS.length-1) ? t.tourDone : t.tourNext;
  }

  // Position spotlight/card. For the chart step, wait until it actually has data.
  const place = ()=>{ const rect = highlight(step.target); positionCard(rect); };
  if(step.gate==="chart"){
    // keep re-placing as the sheet lays out; the chart is already filling live
    place();
    setTimeout(place, 300); setTimeout(place, 900);
  } else {
    setTimeout(place, 60);
  }
}

function endTour(){
  tourActive = false;
  tourEl.hidden = true;
  tourEl.classList.remove("pass");
  tourHole.classList.remove("pulse");
  window.__onTourFieldTap = null;
  try{ localStorage.setItem(TOUR_KEY,"1"); }catch{}
}
tourNextBtn.addEventListener("click",()=>{
  if(tourIdx < TOUR_STEPS.length-1) showTourStep(tourIdx+1);
  else endTour();
});
tourSkipBtn.addEventListener("click", endTour);
document.getElementById("help-btn").addEventListener("click", ()=>{
  pinsPanel.hidden = true; startTour();
});
window.addEventListener("resize",()=>{
  if(tourActive){ const rect = highlight(TOUR_STEPS[tourIdx].target); positionCard(rect); }
});

function maybeAutoTour(){
  // ?tour=1 in the URL forces the tour (handy for testing, or re-showing an
  // updated tour to users who already saw the old one).
  let forced=false;
  try{ forced = new URLSearchParams(location.search).get("tour")==="1"; }catch{}
  let seen=false; try{ seen = localStorage.getItem(TOUR_KEY)==="1"; }catch{}
  if(seen && !forced) return;
  // Don't rely on the 'load' event (it may already have fired by now). Poll for
  // readiness and start once the map can be projected against.
  let tries=0;
  const tryStart = ()=>{
    if(map && map.isStyleLoaded && map.isStyleLoaded()){ startTour(); return; }
    if(++tries < 40){ setTimeout(tryStart, 150); }   // up to ~6s
    else startTour();                                 // start anyway
  };
  tryStart();
}

renderPins();

applyLang("en");

// Keep the sparkline crisp and correctly proportioned after resize/rotate.
let __resizeT;
window.addEventListener("resize",()=>{
  clearTimeout(__resizeT);
  __resizeT = setTimeout(()=>{
    if(lastField && sheet.classList.contains("open") && lastField.__history) drawSpark(lastField.__history);
  },150);
});
</script>
