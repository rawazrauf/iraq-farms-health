<h2>Privacy</h2>
<p class="upd">Last updated 13 November 2026</p>
<div class="box">In short: there is no account and the app never asks for your name. Your saved fields stay on your phone.
Visits are recorded with Microsoft Clarity, including the part of the map you look at, so we can see where people get stuck and fix it.</div>

<h3>Kept on your device</h3>
<p>Your saved fields, your ranking list and your language choice are kept in your browser on your own device. They are not sent to us.</p>

<h3>Recordings of visits (Microsoft Clarity)</h3>
<p>When you use the app, <a href="https://clarity.microsoft.com/" target="_blank" rel="noopener">Microsoft Clarity</a> records the visit:</p>
<ul>
<li>your taps and scrolling, and the buttons and panels you open;</li>
<li>the page address, which holds the map position (latitude, longitude and zoom) and, when a field is open, that field's position;</li>
<li>a random visitor ID, your approximate location worked out from your internet address, and your device and browser type.</li>
</ul>
<p>It does not record your name. Numbers and the text you type are hidden in the recording, and the map picture itself is not recorded.</p>
<p><b>Why:</b> to see whether people can find their field and use the app, and to fix the places where they get stuck.</p>
<p><b>Who sees it:</b> the person who runs Iraq Farms Health, and Microsoft, which provides Clarity under the
<a href="https://privacy.microsoft.com/privacystatement" target="_blank" rel="noopener">Microsoft Privacy Statement</a>.
Recordings are available for up to 30 days. We do not sell this information or use it for advertising.</p>
<p><b>If you prefer not to be recorded:</b> a browser setting or add-on that blocks trackers (blocking clarity.ms) stops the recordings. The app works the same without them.</p>

<h3>"My location"</h3>
<p>Your phone's location is used only to move the map to where you are. The app does not store it, but the map position you then see becomes part of the page address, and so of the recording.</p>

<h3>Services that provide the data</h3>
<p>To show a field, your browser asks other services for data: Microsoft Planetary Computer (satellite readings for the field's outline), Open-Meteo (rainfall at the field's centre), Terrascope (the 2021 crop map), Esri, NASA and Google (map pictures), Google (fonts) and jsDelivr (the map software). Like any website, they see the request and your internet address.</p>
<p>Search: village and town names are looked up in a list inside the page, so what you type stays in your browser. Only when that list has no match and you press Enter is the text sent to OpenStreetMap's Nominatim search, which also sees your internet address.</p>

<h3>Questions</h3>
<p>Open an issue on <a href="https://github.com/rawazrauf/iraq-farms-health/issues" target="_blank" rel="noopener">GitHub</a>.</p>`},

function pick(){
  try{ const q = new URLSearchParams(location.search).get("lang"); if(T[q]) return q; }catch{}
  try{ const s = localStorage.getItem("ifh.lang"); if(T[s]) return s; }catch{}
  return "en";
}
function show(L){
  const t = T[L];
  document.documentElement.lang = L;
  document.documentElement.dir = t.dir;
  document.getElementById("body").innerHTML = t.html;
  const back = document.getElementById("back");
  back.textContent = t.back; back.href = "/?lang=" + L;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === L));
  try{ const p = new URLSearchParams(location.search); p.set("lang", L); history.replaceState(null, "", location.pathname + "?" + p); }catch{}
}
document.querySelectorAll("#lang button").forEach(b => b.addEventListener("click", () => show(b.dataset.lang)));
show(pick());
