en:{dir:"ltr", back:"← Back to the map", html:`
<h2>Privacy</h2>
<p class="upd">Last updated 14 November 2026</p>
<div class="box">In short: there is no account and the app never asks for your name. Your saved fields stay on your phone.
We count visits and a few actions, such as how many fields are opened, without cookies and without recording who you are or where you look on the map.</div>

<h3>Kept on your device</h3>
<p>Your saved fields, your ranking list and your language choice are kept in your browser on your own device. They are not sent to us.</p>

<h3>Counting visits (GoatCounter)</h3>
<p>We use <a href="https://www.goatcounter.com/" target="_blank" rel="noopener">GoatCounter</a> to count how the app is used, so we can see what works and fix what does not. It does not use cookies and does not record your screen.</p>
<p>For each visit it counts:</p>
<ul>
<li>that the map was opened, the website or link that sent you, your device type, browser and screen size, and your country, worked out from your internet address (the address itself is not kept);</li>
<li>a few actions, by name only: opening a field, Random farm, Watch month by month, Save, Share, Report, My location, the guide, the language you use, and the kind of search you made and whether it found something.</li>
</ul>
<p>It does not count which field you opened, where you were on the map, or what you typed in the search box.</p>
<p><b>Who sees it:</b> the person who runs Iraq Farms Health. GoatCounter's own rules are in its <a href="https://www.goatcounter.com/privacy" target="_blank" rel="noopener">privacy policy</a>. We do not sell this information or use it for advertising.</p>
<p><b>If you prefer not to be counted:</b> a browser setting or add-on that blocks trackers stops it. The app works the same.</p>

<h3>"My location"</h3>
<p>Your phone's location is used only to move the map to where you are. The app does not store it or send it anywhere. The map position shows in the page address in your browser, but it is not sent to GoatCounter.</p>

<h3>Services that provide the data</h3>
<p>To show a field, your browser asks other services for data: Microsoft Planetary Computer (satellite readings for the field's outline), Open-Meteo (rainfall at the field's centre), Terrascope (the 2021 crop map), Esri, NASA and Google (map pictures), Google (fonts) and jsDelivr (the map software). Like any website, they see the request and your internet address.</p>
<p>Search: village and town names are looked up in a list inside the page, so what you type stays in your browser. Only when that list has no match and you press Enter is the text sent to OpenStreetMap's Nominatim search, which also sees your internet address.</p>

<h3>Questions</h3>
<p>Open an issue on <a href="https://github.com/rawazrauf/iraq-farms-health/issues" target="_blank" rel="noopener">GitHub</a>.</p>`},

<div class="box">باختصار: لا يوجد حساب، ولا يطلب التطبيق اسمك أبداً. حقولك المحفوظة تبقى على هاتفك.

<h3>ما يبقى على جهازك</h3>
<p>حقولك المحفوظة وقائمة الترتيب واختيار اللغة تُحفظ في متصفحك على جهازك فقط، ولا تُرسَل إلينا.</p>

<h3>إحصاء الزيارات (GoatCounter)</h3>
<p>نستخدم <a href="https://www.goatcounter.com/" target="_blank" rel="noopener">GoatCounter</a> لإحصاء طريقة استخدام التطبيق، لنعرف ما ينجح ونصلح ما لا ينجح. لا يستخدم ملفات تعريف الارتباط ولا يسجّل شاشتك.</p>
<p>في كل زيارة يُحصي:</p>
<ul>
<li>أن الخريطة فُتحت، والموقع أو الرابط الذي أوصلك، ونوع جهازك ومتصفحك وحجم شاشتك، وبلدك المستنتج من عنوان الإنترنت (العنوان نفسه لا يُحفظ)؛</li>
<li>بعض الإجراءات بالاسم فقط: فتح حقل، ومزرعة عشوائية، وشاهد شهراً بشهر، والحفظ، والمشاركة، والتقرير، وموقعي، والدليل، واللغة التي تستخدمها، ونوع البحث الذي أجريته وهل وجد نتيجة.</li>
</ul>
<p>لا يُحصي أيّ حقل فتحت، ولا مكانك على الخريطة، ولا ما كتبته في مربع البحث.</p>
<p><b>من يطّلع عليها:</b> الشخص الذي يدير Iraq Farms Health. قواعد GoatCounter نفسها في <a href="https://www.goatcounter.com/privacy" target="_blank" rel="noopener">سياسة الخصوصية</a> الخاصة به. لا نبيع هذه المعلومات ولا نستخدمها للإعلانات.</p>
<p><b>إن كنت لا تريد أن تُحصى زيارتك:</b> إعداد في المتصفح أو إضافة تحجب أدوات التتبّع يوقف ذلك، ويعمل التطبيق كما هو.</p>

<h3>«موقعي»</h3>

<h3>الخدمات التي توفّر البيانات</h3>
<p>لعرض حقل، يطلب متصفحك بيانات من خدمات أخرى: Microsoft Planetary Computer (قراءات الأقمار الصناعية لحدود الحقل)، وOpen-Meteo (الأمطار عند مركز الحقل)، وTerrascope (خريطة المحاصيل لعام 2021)، وEsri وNASA وGoogle (صور الخريطة)، وGoogle (الخطوط)، وjsDelivr (برنامج الخريطة). وكأي موقع على الإنترنت، ترى هذه الخدمات الطلب وعنوان الإنترنت الخاص بك.</p>
<p>البحث: تُبحث أسماء القرى والبلدات في قائمة داخل الصفحة، فيبقى ما تكتبه في متصفحك. فقط عندما لا تجد القائمة تطابقاً وتضغط Enter، يُرسل النص إلى بحث Nominatim التابع لـ OpenStreetMap، الذي يرى أيضاً عنوان الإنترنت الخاص بك.</p>

<h3>أسئلة</h3>
<p>افتح موضوعاً (issue) على <a href="https://github.com/rawazrauf/iraq-farms-health/issues" target="_blank" rel="noopener">GitHub</a>.</p>`},

<h2>تایبەتێتی</h2>
<p class="upd">دوایین نوێکردنەوە: ١٤ی تشرینی دووەمی ٢٠٢٦</p>

سەردانەکان و هەندێک کردار دەژمێرین، وەک ژمارەی ئەو کێڵگانەی دەکرێنەوە، بەبێ کووکی و بەبێ تۆمارکردنی ئەوەی تۆ کێیت یان سەیری کوێی نەخشە دەکەیت.</div>

<h3>ئەوەی لەسەر ئامێرەکەت دەمێنێتەوە</h3>
<p>کێڵگە پاشەکەوتکراوەکانت، لیستی ڕیزبەندی و زمانی هەڵبژێردراوت لە وێبگەڕەکەتدا لەسەر ئامێرەکەی خۆت هەڵدەگیرێن و بۆ ئێمە نانێردرێن.</p>

<h3>ژماردنی سەردانەکان (GoatCounter)</h3>
<p><a href="https://www.goatcounter.com/" target="_blank" rel="noopener">GoatCounter</a> بەکاردەهێنین بۆ ژماردنی چۆنیەتی بەکارهێنانی ئەپەکە، بۆ ئەوەی بزانین چی باش کار دەکات و ئەوەی کار ناکات چاکی بکەینەوە. کووکی بەکارناهێنێت و شاشەکەت تۆمار ناکات.</p>
<p>لە هەر سەردانێکدا ئەمانە دەژمێرێت:</p>
<ul>

<p>ناژمێرێت کام کێڵگەت کردەوە، لە کوێی نەخشە بوویت، یان چیت لە بۆکسی گەڕاندا نووسی.</p>
<p><b>کێ دەیبینێت:</b> ئەو کەسەی Iraq Farms Health بەڕێوە دەبات. یاساکانی GoatCounter خۆی لە <a href="https://www.goatcounter.com/privacy" target="_blank" rel="noopener">سیاسەتی تایبەتێتی</a>ـیەکەیدایە. ئێمە ئەم زانیارییانە نافرۆشین و بۆ ڕیکلام بەکاریان ناهێنین.</p>
<p><b>ئەگەر ناتەوێت بژمێردرێیت:</b> ڕێکخستنێکی وێبگەڕ یان زیادکراوێک کە ئامرازەکانی شوێنکەوتن دەگرێت ئەمە ڕادەگرێت. ئەپەکە هەروەک خۆی کار دەکات.</p>

<h3>«شوێنی من»</h3>
<p>شوێنی مۆبایلەکەت تەنها بۆ بردنی نەخشە بۆ شوێنەکەت بەکاردێت. ئەپەکە هەڵیناگرێت و بۆ هیچ شوێنێکی نانێرێت. شوێنی نەخشە لە ناونیشانی پەڕەکەدا لە وێبگەڕەکەتدا دەردەکەوێت، بەڵام بۆ GoatCounter نانێردرێت.</p>

<h3>ئەو خزمەتگوزارییانەی داتا دابین دەکەن</h3>
<p>بۆ پیشاندانی کێڵگەیەک، وێبگەڕەکەت داتا لە خزمەتگوزاری تر داوا دەکات: Microsoft Planetary Computer (خوێندنەوەی سەتەلایت بۆ سنووری کێڵگەکە)، Open-Meteo (باران لە ناوەڕاستی کێڵگەکە)، Terrascope (نەخشەی دانەوێڵەی ٢٠٢١)، Esri و NASA و Google (وێنەکانی نەخشە)، Google (فۆنتەکان) و jsDelivr (نەرمەکاڵای نەخشە). وەک هەر ماڵپەڕێک، ئەوان داواکارییەکە و ناونیشانی ئینتەرنێتەکەت دەبینن.</p>
<p>گەڕان: ناوی گوند و شارۆچکەکان لە لیستێکی ناو پەڕەکەدا دەگەڕێنرێن، بۆیە ئەوەی دەینووسیت لە وێبگەڕەکەتدا دەمێنێتەوە. تەنها کاتێک لیستەکە هیچی نەدۆزییەوە و Enter دادەگریت، دەقەکە بۆ گەڕانی Nominatimـی OpenStreetMap دەنێردرێت، کە ئەویش ناونیشانی ئینتەرنێتەکەت دەبینێت.</p>

function pick(){
  try{ const q = new URLSearchParams(location.search).get("lang"); if(T[q]) return q; }catch{}
  try{ const s = localStorage.getItem("ifh.lang"); if(T[s]) return s; }catch{}
  return "en";
}
function show(L){
  const t = T[L];
  document.documentElement.lang = L;
  document.documentElement.dir = t.dir;
  document.getElementById("body").innerHTML = t.html;
  const back = document.getElementById("back");
  back.textContent = t.back; back.href = "/?lang=" + L;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === L));
  try{ const p = new URLSearchParams(location.search); p.set("lang", L); history.replaceState(null, "", location.pathname + "?" + p); }catch{}
}
document.querySelectorAll("#lang button").forEach(b => b.addEventListener("click", () => show(b.dataset.lang)));
show(pick());
</script>
