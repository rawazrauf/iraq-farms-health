<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldCereal layer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root{color-scheme:dark; --panel:rgba(18,22,15,.93); --ink:#e9e6da;
        --muted:#9aa093; --line:#3a4030; --ok:#8fbf82; --bad:#e08585;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0d100a;color:var(--ink);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #map{position:absolute;inset:0}
  #status{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;
    padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);
    font:11.5px ui-monospace,Menlo,monospace}
  #panel{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--panel);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:10px max(12px,env(safe-area-inset-left,0px))
            calc(10px + env(safe-area-inset-bottom,0px))
            max(12px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .row label{font-size:11.5px;color:var(--muted);min-width:58px}
  input[type=range]{flex:1;min-width:110px;accent-color:var(--ok)}
  button{font:inherit;font-size:12px;padding:5px 9px;border-radius:7px;
    border:1px solid var(--line);background:#1a1f14;color:var(--ink);cursor:pointer}
  button.on{background:var(--ok);color:#10140c;border-color:var(--ok)}
  .val{font:11.5px ui-monospace,Menlo,monospace;min-width:42px;text-align:right}
  #readout{font:11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre}
  #readout b{color:var(--ink);font-weight:500}
</style>
</head>
<body>

<div id="map"></div>
<div id="status">pick a product</div>

<div id="panel">
  <div class="row" id="products"></div>
  <div class="row">
    <label for="op">Opacity</label>
    <input type="range" id="op" min="0" max="100" value="70">
    <span class="val" id="opVal">0.70</span>
    <button id="cmap" class="on">Transparent 0</button>
  </div>
  <div id="readout"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
const ESRI = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

/* Verified working form (probed on-device 2026-10-17): KVP GetTile, integer
   TileMatrix, and TIME as a query parameter. The RESTful templates advertised
   in the capabilities document are NOT served — they answer
   "Missing WMTS 'SERVICE' parameter". */
const PRODUCTS = [
  ["Winter cereals", "wintercereals",   "#ba7135"],
  ["Spring cereals", "springcereals",   "#d89b53"],
  ["Maize",          "maize",           "#fccf05"],
  ["Irrigation",     "irrigation",      "#0257B9"],
  ["Active cropland","activecropland",  "#663b02"],
  ["Temporary crops","temporarycrops",  "#e47c05"]
];

function wcTiles(product, colour, transparentZero){
  // Leaving class 0 out of the colormap keeps non-crop pixels transparent;
  // the service's own default paints 0 solid grey, which would blanket Iraq.
  const cmap = transparentZero ? {"100": colour}
                               : {"0": "#757575", "100": colour};
  return "https://wmts.terrascope.be/wmts?service=WMTS&request=GetTile&version=1.0.0"
    + `&layer=esa-worldcereal-${product}-10m-2021-v1_classification`
    + "&style=default&format=image%2Fpng&tilematrixset=EPSG:3857"
    + "&TileMatrix={z}&TileRow={y}&TileCol={x}&TIME=2021-01-01"
    + "&name=classification&assets=classification&nodata=255"
    + "&colormap=" + encodeURIComponent(JSON.stringify(cmap));
}

const map = new maplibregl.Map({
  container:"map",
  style:{ version:8,
    sources:{ esri:{ type:"raster", tiles:[ESRI], tileSize:256,
                     attribution:"Esri, Maxar, Earthstar Geographics" } },
    layers:[{ id:"sat", type:"raster", source:"esri" }] },
  center:[44.55, 31.85], zoom:11, maxZoom:16, minZoom:4,
  attributionControl:false,
  pitchWithRotate:false, dragRotate:false, touchPitch:false, maxPitch:0
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");

let active = null, transparentZero = true;
const el = id => document.getElementById(id);

PRODUCTS.forEach(([label, product, colour]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = () => select(product, label, colour, b);
  el("products").appendChild(b);
});

function select(product, label, colour, btn){
  [...el("products").children].forEach(c => c.classList.remove("on"));
  btn.classList.add("on");
  if(map.getLayer("wc")) map.removeLayer("wc");
  if(map.getSource("wc")) map.removeSource("wc");
  map.addSource("wc", {
    type:"raster", tiles:[wcTiles(product, colour, transparentZero)],
    tileSize:256, maxzoom:14,
    attribution:"ESA WorldCereal 2021 (CC-BY 4.0) via Terrascope"
  });
  map.addLayer({ id:"wc", type:"raster", source:"wc",
    paint:{ "raster-opacity": +el("op").value/100, "raster-fade-duration":200 } });
  active = { product, label, colour };
  el("status").textContent = label + " · " + product;
  report();
}

let tiles = {ok:0, err:0};
map.on("sourcedata", e => { if(e.sourceId === "wc" && e.isSourceLoaded) report(); });
map.on("error", e => { if(e.sourceId === "wc"){ tiles.err++; report(); } });
map.on("zoom", report);

function report(){
  el("opVal").textContent = (+el("op").value/100).toFixed(2);
  el("readout").innerHTML =
`product   <b>${active ? active.label : "—"}</b>
zero      <b>${transparentZero ? "transparent" : "grey #757575"}</b>
opacity   <b>${(+el("op").value/100).toFixed(2)}</b>
zoom      <b>${map.getZoom().toFixed(1)}</b>   tile errors <b>${tiles.err}</b>`;
}

el("op").addEventListener("input", () => {
  if(map.getLayer("wc")) map.setPaintProperty("wc","raster-opacity", +el("op").value/100);
  report();
});
el("cmap").addEventListener("click", e => {
  transparentZero = !transparentZero;
  e.target.classList.toggle("on", transparentZero);
  e.target.textContent = transparentZero ? "Transparent 0" : "Grey 0";
  if(active){
    const btn = [...el("products").children].find(c => c.classList.contains("on"));
    select(active.product, active.label, active.colour, btn);
  }
  report();
});

map.on("load", () => {
  const first = el("products").children[0];
  select("wintercereals", "Winter cereals", "#ba7135", first);
});
</script>
</body>
</html>
