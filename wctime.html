<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldCereal TIME</title>
<style>
  :root{color-scheme:dark; --bg:#13160f; --panel:#1c2017; --ink:#e9e6da;
        --muted:#9aa093; --line:#333829; --ok:#8fbf82; --bad:#e08585;}
  *{box-sizing:border-box}
  body{margin:0;padding:14px;background:var(--bg);color:var(--ink);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{font-size:17px;margin:0 0 4px}
  p.sub{margin:0 0 14px;color:var(--muted);font-size:12.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:12px;margin-bottom:10px}
  .card h2{font-size:13px;margin:0 0 6px}
  .u{font:10.5px/1.3 ui-monospace,Menlo,monospace;color:var(--muted);
     word-break:break-all;margin-bottom:8px}
  .row{display:flex;gap:10px;align-items:flex-start}
  img.t{width:104px;height:104px;border:1px solid var(--line);border-radius:6px;
        background:#000;flex:0 0 auto}
  pre{font:11.5px/1.5 ui-monospace,Menlo,monospace;margin:0;white-space:pre-wrap;
      word-break:break-all;flex:1;min-width:0}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
</style>
</head>
<body>

<h1>WorldCereal TIME</h1>
<p class="sub">The service says <code>Missing 'TIME' parameters</code>. These are the places
it could want the date. Tile is z12 over Mishkhab. A green <strong>200 image/png</strong>
with a loaded tile is the winner.</p>

<div id="out"></div>

<script>
const BASE  = "https://wmts.terrascope.be";
const PROD  = "esa-worldcereal-wintercereals-10m-2021-v1";
const LAYER = PROD + "_classification";
const Z = 12, X = 2554, Y = 1665;          // Mishkhab, southern rice belt
const DATE = "2021-01-01";

// Only paint where the class is present: 0 left out of the colormap means
// transparent, so the backdrop beneath stays visible.
const CMAP = encodeURIComponent(JSON.stringify({"100":"#ba7135"}));
const QS   = `name=classification&assets=classification&nodata=255&colormap=${CMAP}`;

const REST = `${BASE}/${PROD}/default`;
const KVP  = `${BASE}/wmts?service=WMTS&request=GetTile&version=1.0.0`
           + `&layer=${LAYER}&style=default&format=image%2Fpng&tilematrixset=EPSG:3857`;

const VARIANTS = [
  ["A · KVP + &TIME=",            `${KVP}&TileMatrix=${Z}&TileRow=${Y}&TileCol=${X}&TIME=${DATE}`],
  ["B · KVP + &time= (lower)",    `${KVP}&TileMatrix=${Z}&TileRow=${Y}&TileCol=${X}&time=${DATE}`],
  ["C · KVP + prefixed matrix",   `${KVP}&TileMatrix=EPSG:3857:${Z}&TileRow=${Y}&TileCol=${X}&TIME=${DATE}`],
  ["D · REST path TIME + params", `${REST}/${DATE}/EPSG:3857/${Z}/${X}/${Y}.png?${QS}`],
  ["E · REST, TIME as query",     `${REST}/EPSG:3857/${Z}/${X}/${Y}.png?${QS}&TIME=${DATE}`],
  ["F · REST path TIME + query",  `${REST}/${DATE}/EPSG:3857/${Z}/${X}/${Y}.png?${QS}&TIME=${DATE}`],
  ["G · REST, year only",         `${REST}/2021/EPSG:3857/${Z}/${X}/${Y}.png?${QS}`],
  ["H · REST, no params at all",  `${REST}/${DATE}/EPSG:3857/${Z}/${X}/${Y}.png`]
];

const out = document.getElementById("out");
VARIANTS.forEach(([name, url]) => {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<h2>${name}</h2><div class="u">${url}</div>`;
  const row = document.createElement("div"); row.className = "row";
  const img = document.createElement("img"); img.className = "t"; img.alt = "";
  const pre = document.createElement("pre"); pre.textContent = "fetch: …\nimg:   …";
  row.append(img, pre); d.appendChild(row); out.appendChild(d);

  const s = { f:"pending", i:"pending" };
  const paint = () => {
    pre.textContent = `fetch: ${s.f}\nimg:   ${s.i}`;
    pre.className = s.f.startsWith("200") ? "ok" : (s.f === "pending" ? "" : "bad");
  };
  fetch(url, {cache:"no-store"})
    .then(async r => {
      const ct = r.headers.get("content-type") || "";
      s.f = r.status + " " + ct;
      if(!r.ok) s.f += "\n       " + (await r.text()).slice(0,180).replace(/\s+/g," ");
      paint();
    })
    .catch(e => { s.f = "THREW " + e.name; paint(); });
  img.onload  = () => { s.i = `loaded ${img.naturalWidth}x${img.naturalHeight}`; paint(); };
  img.onerror = () => { s.i = "failed"; paint(); };
  img.src = url; paint();
});
</script>
</body>
</html>
